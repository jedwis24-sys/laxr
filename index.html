<script>
const POS={Attack:['Shooting','Dodging','Passing','Stickwork','Lacrosse IQ','Speed','Finishing','Off-ball IQ'],Midfield:['Speed','Dodging','Passing','Shooting','Lacrosse IQ','Acceleration','Ground Balls','Transition'],Defense:['On-Ball Defense','Footwork','Stick Checks','Slide IQ','Ground Balls','Strength','Communication','Speed'],LSM:['On-Ball Defense','Speed','Ground Balls','Footwork','Transition','Stick Checks','Communication','Lacrosse IQ'],FOGO:['Faceoffs','Clamps','Wing Play','Ground Balls','Quickness','Technique','Transition','Lacrosse IQ'],Goalie:['Hands','Reactions','Positioning','Communication','Clearing','Angle Play','Quickness','Lacrosse IQ']};

const SCHOOLS=[
['Rutgers','D-I','Big Ten','Piscataway, NJ',4,2,'High'],['Penn State','D-I','Big Ten','University Park, PA',4,2,'High'],['Maryland','D-I','Big Ten','College Park, MD',5,2,'High'],['Johns Hopkins','D-I','Big Ten','Baltimore, MD',5,5,'High'],['Princeton','D-I','Ivy League','Princeton, NJ',5,5,'Very High'],['Penn','D-I','Ivy League','Philadelphia, PA',5,5,'Very High'],['Cornell','D-I','Ivy League','Ithaca, NY',5,5,'Very High'],['Harvard','D-I','Ivy League','Cambridge, MA',5,5,'Very High'],['Yale','D-I','Ivy League','New Haven, CT',5,5,'Very High'],['Brown','D-I','Ivy League','Providence, RI',4,5,'Very High'],['Dartmouth','D-I','Ivy League','Hanover, NH',4,5,'Very High'],['Columbia','D-I','Ivy League','New York, NY',3,5,'Very High'],['Villanova','D-I','Big East','Villanova, PA',4,3,'High'],['Georgetown','D-I','Big East','Washington, DC',5,4,'High'],['Syracuse','D-I','ACC','Syracuse, NY',5,2,'Medium'],['Notre Dame','D-I','ACC','South Bend, IN',5,3,'High'],['Virginia','D-I','ACC','Charlottesville, VA',5,3,'High'],['Duke','D-I','ACC','Durham, NC',5,3,'High'],['North Carolina','D-I','ACC','Chapel Hill, NC',5,3,'High'],['Army','D-I','Patriot','West Point, NY',4,3,'High'],['Navy','D-I','Patriot','Annapolis, MD',4,3,'High'],['Lehigh','D-I','Patriot','Bethlehem, PA',4,4,'High'],['Loyola Maryland','D-I','Patriot','Baltimore, MD',4,3,'Medium'],['Drexel','D-I','CAA','Philadelphia, PA',3,2,'Medium'],['Delaware','D-I','CAA','Newark, DE',3,2,'Medium'],['St. Joseph’s','D-I','Atlantic 10','Philadelphia, PA',3,3,'Medium'],['Monmouth','D-I','CAA','West Long Branch, NJ',2,2,'Medium'],['Wagner','D-I','NEC','Staten Island, NY',2,1,'Medium'],
['Limestone','D-II','South Atlantic','Gaffney, SC',4,2,'Medium'],['Mercyhurst','D-II','Great Midwest','Erie, PA',4,2,'Medium'],['Adelphi','D-II','NE10','Garden City, NY',4,2,'Medium'],['Le Moyne','D-II','NE10','Syracuse, NY',4,2,'Medium'],['Seton Hill','D-II','PSAC','Greensburg, PA',3,2,'Medium'],['West Chester','D-II','PSAC','West Chester, PA',3,2,'Medium'],['Saint Leo','D-II','SSC','Saint Leo, FL',3,1,'Medium'],['Rollins','D-II','SSC','Winter Park, FL',3,2,'High'],['Tampa','D-II','SSC','Tampa, FL',4,1,'Medium'],['Maryville','D-II','GLVC','St. Louis, MO',3,1,'Medium'],
['Tufts','D-III','NESCAC','Medford, MA',5,5,'Very High'],['RIT','D-III','Liberty','Rochester, NY',5,3,'High'],['Salisbury','D-III','Coast-to-Coast','Salisbury, MD',5,2,'Medium'],['Christopher Newport','D-III','C2C','Newport News, VA',4,2,'Medium'],['Stevens','D-III','MAC Freedom','Hoboken, NJ',4,4,'High'],['Gettysburg','D-III','Centennial','Gettysburg, PA',4,4,'High'],['Dickinson','D-III','Centennial','Carlisle, PA',3,4,'High'],['Washington College','D-III','Centennial','Chestertown, MD',3,3,'Medium'],['Ursinus','D-III','Centennial','Collegeville, PA',2,3,'Medium'],['Haverford','D-III','Centennial','Haverford, PA',3,5,'Very High'],['Swarthmore','D-III','Centennial','Swarthmore, PA',3,5,'Very High'],['Widener','D-III','MAC Commonwealth','Chester, PA',2,2,'Medium'],['Arcadia','D-III','MAC Commonwealth','Glenside, PA',2,2,'Medium'],['Montclair State','D-III','NJAC','Montclair, NJ',3,2,'Medium'],['Kean','D-III','NJAC','Union, NJ',2,2,'Medium'],['Stevenson','D-III','MAC Commonwealth','Owings Mills, MD',3,2,'Medium'],['York College','D-III','MAC Commonwealth','York, PA',3,2,'Medium'],['Muhlenberg','D-III','Centennial','Allentown, PA',2,4,'High'],['F&M','D-III','Centennial','Lancaster, PA',3,4,'High'],['McDaniel','D-III','Centennial','Westminster, MD',2,3,'Medium']
];
let state=JSON.parse(localStorage.getItem('laxr_save')||'null')||{created:false,player:{name:'',class:'2027',position:'Attack',hand:'Right',height:'6\'0"',weight:185,highSchool:'',club:'',hometown:'',gpa:3.2,stats:{},film:0,exposure:18,training:0},interest:{},offers:[],messages:[],activities:[],visits:[],day:1};
function save(){localStorage.setItem('laxr_save',JSON.stringify(state));document.getElementById('saveStatus').textContent='SAVED '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function ratings(){let a=state.player.stats, vals=POS[state.player.position].map(k=>+a[k]||0);return Math.round(vals.reduce((x,y)=>x+y,0)/vals.length)}
function tier(){let r=ratings();return r>=82?'National recruit':r>=76?'D-I / high D-II target':r>=70?'D-II / D-III target':'Developmental recruit'}
function initStats(){state.player.stats={...BASE[state.player.position]};}
function log(txt){state.activities.unshift({d:state.day,t:txt});state.activities=state.activities.slice(0,18);}
function schoolInterest(i){let s=SCHOOLS[i], p=state.player, r=ratings(), base=0;let div=s[1], tier=s[4], acad=s[5];
 let threshold=div==='D-I'?76:div==='D-II'?68:62; base=50+(r-threshold)*6+(p.exposure*.35)+(state.player.film*3)+(Math.random()*16-8); if(tier===5)base-=18;if(tier===4)base-=8;if(s[2]==='Ivy League'){base+=(p.gpa-3.4)*35;}else base+=(p.gpa-2.8)*5;return Math.max(0,Math.min(99,Math.round(base)));}
function seedInterest(){SCHOOLS.forEach((s,i)=>{if(state.interest[i]==null)state.interest[i]=schoolInterest(i)});}
function render(){seedInterest();renderDash();renderPlayer();renderRecruiting();renderCoaches();renderTraining();renderFilm();renderVisits();renderColleges();document.querySelectorAll('.nav[data-view]').forEach(n=>n.onclick=()=>show(n.dataset.view));document.getElementById('interestCount').textContent=Object.values(state.interest).filter(x=>x>=60).length;document.getElementById('msgCount').textContent=state.messages.length;}
function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(v).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));document.querySelector('.nav[data-view="'+v+'"]')?.classList.add('active');}
function header(e,t,s){return `<div class="eyebrow">${e}</div><div class="title">${t}</div><div class="sub">${s}</div><div class="rule"></div>`}
function renderDash(){let p=state.player,r=ratings(),hot=SCHOOLS.map((s,i)=>({...s,i,x:state.interest[i]})).sort((a,b)=>b.x-a.x).slice(0,6);document.getElementById('dashboard').innerHTML=header('LAXR / PLAYER FILE',p.name||'Create your player',p.name?`${p.position} · Class of ${p.class} · ${tier()}`:'Build the player first. Every recruiting action will react to this file.')+(!state.created?`<div class="notice"><b>PLAYER FILE NOT CREATED.</b> Start in Player File, set your profile and ratings, then the recruiting world becomes active.</div>`:'')+`<div class="g4 grid"><div class="panel"><div class="tiny">Overall</div><div class="num">${state.created?r:'—'}</div><div class="tiny">Position weighted</div></div><div class="panel"><div class="tiny">Exposure</div><div class="num">${state.created?p.exposure:'—'}</div><div class="tiny">Tournament / film reach</div></div><div class="panel"><div class="tiny">Schools tracking</div><div class="num">${state.created?Object.values(state.interest).filter(x=>x>=60).length:'—'}</div><div class="tiny">Meaningful interest</div></div><div class="panel"><div class="tiny">Offers</div><div class="num">${state.offers.length}</div><div class="tiny">Current offers</div></div></div><div class="rule"></div><div class="two-col"><div class="panel"><h3>Recruiting board — current leaders</h3><table class="table"><thead><tr><th>School</th><th>Division</th><th>Interest</th><th>Status</th></tr></thead><tbody>${hot.map(s=>`<tr><td><b>${s[0]}</b><br><span class="tiny">${s[2]}</span></td><td><span class="pill ${s[1].toLowerCase().replace('-','')}">${s[1]}</span></td><td><div class="meter red"><i style="width:${s.x}%"></i></div><span class="tiny">${s.x}%</span></td><td>${state.offers.includes(s[0])?'<span class="pill good">OFFER</span>':s.x>=80?'<span class="pill">HOT</span>':'Tracking'}</td></tr>`).join('')}</tbody></table></div><div class="panel"><h3>Activity log</h3><ul class="feed">${state.activities.length?state.activities.slice(0,8).map(a=>`<li><div class="date">Day ${a.d}</div>${esc(a.t)}</li>`).join(''):'<li>No activity yet.</li>'}</ul></div></div>`}
function renderPlayer(){let p=state.player;document.getElementById('player').innerHTML=header('PLAYER DATABASE','Player file','This is the information coaches evaluate. Position changes the attribute model and the way schools value your profile.')+`<div class="panel"><div class="formgrid"><div class="field"><label>Name</label><input id="pname" value="${esc(p.name)}"></div><div class="field"><label>Class</label><select id="pclass">${['2027','2028','2029','2030'].map(x=>`<option ${p.class===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Position</label><select id="ppos">${Object.keys(POS).map(x=>`<option ${p.position===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Hand</label><select id="phand"><option ${p.hand==='Right'?'selected':''}>Right</option><option ${p.hand==='Left'?'selected':''}>Left</option></select></div><div class="field"><label>Height</label><input id="pheight" value="${esc(p.height)}"></div><div class="field"><label>Weight</label><input id="pweight" type="number" value="${p.weight}"></div><div class="field"><label>High School</label><input id="phs" value="${esc(p.highSchool)}"></div><div class="field"><label>Club</label><input id="pclub" value="${esc(p.club)}"></div><div class="field"><label>Hometown</label><input id="phome" value="${esc(p.hometown)}"></div><div class="field"><label>GPA</label><input id="pgpa" type="number" step=".01" min="0" max="4" value="${p.gpa}"></div></div><div class="rule"></div><button class="btn red" id="createPlayer">Save player file</button></div><div class="rule"></div>${state.created?`<div class="two-col"><div class="panel"><div class="profile-head"><div><div class="eyebrow">${p.position}</div><h3>${esc(p.name)}</h3><div class="sub">Class ${p.class} · ${p.hand}-handed · ${esc(p.height)} · ${p.weight} lb</div></div><div class="rating">${ratings()}<small>Overall</small></div></div><div class="rule"></div><div class="attrs">${POS[p.position].map(k=>`<div class="attr"><div class="attrrow"><span>${k}</span><span>${p.stats[k]}</span></div><input class="slider" data-attr="${esc(k)}" type="range" min="40" max="95" value="${p.stats[k]}"><div class="meter"><i style="width:${p.stats[k]}%"></i></div></div>`).join('')}</div><div class="rule"></div><button class="btn" id="saveAttrs">Save ratings</button></div><div class="panel"><h3>Academic / recruiting file</h3><div class="stat"><span>GPA</span><b>${p.gpa.toFixed(2)}</b></div><div class="stat"><span>Film</span><b>${p.film} clips</b></div><div class="stat"><span>Exposure</span><b>${p.exposure}/100</b></div><div class="stat"><span>Recruiting level</span><b>${tier()}</b></div><div class="notice">Academics are an influence, not a mini-game. Ivy programs use the strongest academic filter; other schools vary in how much GPA affects fit.</div></div></div>`:''}`;
document.getElementById('ppos').onchange=e=>{p.position=e.target.value;initStats();render()};document.getElementById('createPlayer').onclick=()=>{p.name=document.getElementById('pname').value.trim()||'Unnamed Prospect';p.class=document.getElementById('pclass').value;p.position=document.getElementById('ppos').value;p.hand=document.getElementById('phand').value;p.height=document.getElementById('pheight').value;p.weight=+document.getElementById('pweight').value;p.highSchool=document.getElementById('phs').value;p.club=document.getElementById('pclub').value;p.hometown=document.getElementById('phome').value;p.gpa=+document.getElementById('pgpa').value||3;state.created=true;if(!Object.keys(p.stats).length)initStats();seedInterest();log('Player file created. Recruiting board activated.');save();render();show('dashboard')};document.getElementById('saveAttrs')?.addEventListener('click',()=>{document.querySelectorAll('.slider').forEach(x=>p.stats[x.dataset.attr]=+x.value);log('Ratings updated from player file.');save();render()});}
function renderRecruiting(){let rows=SCHOOLS.map((s,i)=>({...s,i,x:state.interest[i]||0})).sort((a,b)=>b.x-a.x);document.getElementById('recruiting').innerHTML=header('RECRUITING','Recruiting board','Filter the college database and work the relationships yourself. Schools can move from quiet tracking to real interest, visits, messages and offers.')+`<div class="panel"><div class="actions"><button class="btn light filter" data-f="ALL">ALL</button><button class="btn light filter" data-f="D-I">D-I</button><button class="btn light filter" data-f="D-II">D-II</button><button class="btn light filter" data-f="D-III">D-III</button><button class="btn light filter" data-f="Ivy League">IVY</button></div><div class="rule"></div><table class="table"><thead><tr><th>School</th><th>Division</th><th>Conference</th><th>Academic fit</th><th>Interest</th><th>Action</th></tr></thead><tbody id="recruitRows">${rows.map(s=>`<tr data-div="${s[1]}" data-conf="${s[2]}"><td><b>${s[0]}</b><br><span class="tiny">${s[3]}</span></td><td><span class="pill ${s[1].toLowerCase().replace('-','')}">${s[1]}</span></td><td>${s[2]}</td><td>${s[6]}</td><td style="min-width:150px"><div class="meter red"><i style="width:${s.x}%"></i></div><span class="tiny">${s.x}%</span></td><td><button class="btn light school" data-i="${s.i}">Open file</button></td></tr>`).join('')}</tbody></table></div>`;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{let f=b.dataset.f;document.querySelectorAll('#recruitRows tr').forEach(r=>r.style.display=f==='ALL'||r.dataset.div===f||r.dataset.conf===f?'':'none')});document.querySelectorAll('.school').forEach(b=>b.onclick=()=>schoolModal(+b.dataset.i));}
function schoolModal(i){let s=SCHOOLS[i],x=state.interest[i], offer=state.offers.includes(s[0]);document.getElementById('modalBox').innerHTML=`<div class="eyebrow">${s[1]} / ${s[2]}</div><h2 style="font-family:Georgia,serif;margin:4px 0">${s[0]}</h2><div class="sub">${s[3]} · Program profile ${s[4]}/5 · Academic emphasis: ${s[6]}</div><div class="rule"></div><div class="g3 grid"><div><div class="tiny">Interest</div><div class="num">${x}%</div></div><div><div class="tiny">Status</div><div class="num">${offer?'OFFER':'TRACKING'}</div></div><div><div class="tiny">Academic fit</div><div class="num">${s[5]}/5</div></div></div><div class="rule"></div><div class="notice">${s[2]==='Ivy League'?'Ivy academic screening is a major part of this relationship. Athletic ability alone does not guarantee an offer.':s[1]==='D-III'?'D-III recruiting can be highly relationship-driven, with academic and roster fit varying substantially by program.':s[1]==='D-II'?'D-II programs can recruit later and may become realistic as exposure and relationships grow.':'D-I programs generally require the strongest combination of athletic level, film, exposure, roster need and fit.'}</div><div class="actions"><button class="btn red" id="contact">Contact coach</button><button class="btn" id="visit">Request visit</button><button class="btn light" id="close">Close</button></div>`;document.getElementById('modal').classList.add('show');document.getElementById('close').onclick=closeModal;document.getElementById('contact').onclick=()=>{let gain=5+Math.floor(Math.random()*9);state.interest[i]=Math.min(99,state.interest[i]+gain);state.messages.unshift({school:s[0],incoming:false,text:`You sent your player profile and recruiting note to the ${s[0]} staff.`});if(state.interest[i]>=82&&!offer&&Math.random()<.3){state.offers.push(s[0]);state.messages.unshift({school:s[0],incoming:true,text:`Coach ${s[0]} wants to keep the conversation going and is discussing an offer.`});log(`${s[0]} moved into serious interest.`)}else log(`Contacted ${s[0]}. Interest moved to ${state.interest[i]}%.`);save();closeModal();render()};document.getElementById('visit').onclick=()=>{state.visits.push({school:s[0],d:state.day});state.interest[i]=Math.min(99,state.interest[i]+8);log(`Visit request sent to ${s[0]}.`);save();closeModal();render()};}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function renderCoaches(){document.getElementById('coaches').innerHTML=header('COMMUNICATIONS','Coaches / inbox','Recruiting is relationship-based. Coaches respond to what you actually do rather than sitting behind a single static meter.')+`<div class="panel">${state.messages.length?state.messages.map((m,i)=>`<div class="coachmsg ${m.incoming?'':'me'}"><div class="date">${m.incoming?'COACH':'YOU'} · ${esc(m.school)}</div>${esc(m.text)}${m.incoming?`<div class="actions" style="margin-top:9px"><button class="choice" data-reply="${i}">Reply professionally and ask about next steps</button><button class="choice" data-reply="${i}">Reply with film / schedule information</button><button class="choice" data-reply="${i}">Keep it short</button></div>`:''}</div>`).join(''):'<div class="notice">No messages yet. Contact schools from the Recruiting Board, upload film, and play events to create opportunities.</div>'}</div>`;document.querySelectorAll('[data-reply]').forEach(b=>b.onclick=()=>{let m=state.messages[+b.dataset.reply];state.messages.unshift({school:m.school,incoming:false,text:'You replied to the coaching staff and kept the relationship moving.'});log(`Replied to ${m.school}.`);save();render()});}
function renderTraining(){let p=state.player;document.getElementById('training').innerHTML=header('DEVELOPMENT','Training','Choose what you actually want to improve. Gains are position-aware; a goalie is not rewarded for pretending to be a midfielder.')+`<div class="two-col"><div class="panel"><h3>Individual work</h3><table class="table"><thead><tr><th>Skill</th><th>Current</th><th>Session</th></tr></thead><tbody>${POS[p.position].map(k=>`<tr><td><b>${k}</b></td><td>${p.stats[k]}</td><td><button class="btn light train" data-a="${esc(k)}">Train</button></td></tr>`).join('')}</tbody></table></div><div class="panel"><h3>Training profile</h3><div class="stat"><span>Sessions completed</span><b>${p.training}</b></div><div class="stat"><span>Overall</span><b>${ratings()}</b></div><div class="stat"><span>Primary position</span><b>${p.position}</b></div><div class="notice">Training improves the player profile gradually. Recruiting still depends on exposure, film, relationships and roster fit.</div></div></div>`;document.querySelectorAll('.train').forEach(b=>b.onclick=()=>{let a=b.dataset.a;p.stats[a]=Math.min(95,p.stats[a]+1+Math.floor(Math.random()*2));p.training++;state.day++;log(`Training session: ${a} improved to ${p.stats[a]}.`);recalc();save();render()});}
function recalc(){SCHOOLS.forEach((s,i)=>{let old=state.interest[i]||0;let drift=(ratings()-72)*.4+p.exposure*.05+(p.gpa-3)*2;state.interest[i]=Math.max(0,Math.min(99,Math.round(old*.92+schoolInterest(i)*.08+drift*.04)));if(state.interest[i]>=88&&!state.offers.includes(s[0])&&Math.random()<.035){state.offers.push(s[0]);state.messages.unshift({school:s[0],incoming:true,text:`The staff wants to talk about your recruiting status. They are seriously evaluating you.`});log(`${s[0]} entered offer-level interest.`)}})}
function renderFilm(){let p=state.player;document.getElementById('film').innerHTML=header('EXPOSURE','Film / exposure','Film is the recruiting currency. Uploading clips, attending tournaments and showing a real schedule can move coaches who would otherwise never see you.')+`<div class="g3 grid"><div class="panel"><div class="tiny">Film clips</div><div class="num">${p.film}</div><div class="rule"></div><button class="btn red" id="upload">Upload game film</button></div><div class="panel"><div class="tiny">Exposure</div><div class="num">${p.exposure}/100</div><div class="meter red"><i style="width:${p.exposure}%"></i></div></div><div class="panel"><div class="tiny">Recruiting effect</div><div class="sub">More exposure makes it easier for the right schools to discover you, but it never guarantees offers.</div></div></div><div class="rule"></div><div class="panel"><h3>What counts</h3><table class="table"><tr><td>Game film upload</td><td>+3–6 exposure</td><td>Shows actual skill</td></tr><tr><td>Club tournament</td><td>+5–12 exposure</td><td>Creates coach discovery chances</td></tr><tr><td>Strong event performance</td><td>Interest spike</td><td>Position and roster need matter</td></tr></table></div>`;document.getElementById('upload').onclick=()=>{p.film++;p.exposure=Math.min(100,p.exposure+3+Math.floor(Math.random()*4));state.day++;recalc();log(`Uploaded game film. Exposure is now ${p.exposure}.`);save();render()};}
function renderVisits(){document.getElementById('visits').innerHTML=header('TRAVEL','Visits','Visits are relationship events. They can turn anonymous interest into a real recruiting relationship.')+`<div class="panel"><h3>Visit history</h3>${state.visits.length?`<table class="table"><thead><tr><th>School</th><th>Day</th><th>Status</th></tr></thead><tbody>${state.visits.map(v=>`<tr><td><b>${v.school}</b></td><td>${v.d}</td><td><span class="pill good">REQUESTED / LOGGED</span></td></tr>`).join('')}</tbody></table>`:'<div class="notice">No visits yet. Open a school file from the recruiting board and request one.</div>'}</div>`}
function renderColleges(){document.getElementById('colleges').innerHTML=header('DIRECTORY','College directory','A built-in D-I through D-III database so the simulator does not force you into one level of lacrosse.')+`<div class="panel"><table class="table"><thead><tr><th>Program</th><th>Division</th><th>Conference</th><th>Location</th><th>Program level</th><th>Academic emphasis</th></tr></thead><tbody>${SCHOOLS.map(s=>`<tr><td><b>${s[0]}</b></td><td><span class="pill ${s[1].toLowerCase().replace('-','')}">${s[1]}</span></td><td>${s[2]}</td><td>${s[3]}</td><td>${s[4]}/5</td><td>${s[6]}</td></tr>`).join('')}</tbody></table></div>`}
if(!Object.keys(state.player.stats).length)initStats();document.getElementById('resetBtn').onclick=()=>{if(confirm('Reset the entire recruiting save?')){localStorage.removeItem('laxr_save');location.reload()}};document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};render();
</script></body></html>
