function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function renderGames(){let p=state.player,idx=state.gamesPlayed||0;document.getElementById('games').innerHTML=header('ON-FIELD','Game schedule','Games are the engine of the career. Your position-specific ratings, opponent strength and variance determine your stat line; recruiting reacts to performance, not button clicks alone.')+`<div class="two-col"><div class="panel"><h3>Season schedule</h3><table class="table"><thead><tr><th>Event</th><th>Opponent / level</th><th>Result</th></tr></thead><tbody>${SCHEDULE.map((g,i)=>`<tr><td><b>${g[0]}</b></td><td>${g[1]}</td><td>${i<idx?(state.gameLog[i]?.result||'Played'):'<span class="pill">UPCOMING</span>'}</td></tr>`).join('')}</tbody></table><div class="rule"></div>${idx<SCHEDULE.length?`<button class="btn red" id="playNext">Play ${SCHEDULE[idx][0]} →</button>`:'<div class="notice">Season complete. Your next season schedule is ready.</div><button class="btn" id="newSeason">Start next season</button>'}</div><div class="panel"><h3>Season performance</h3><div class="stat"><span>Games played</span><b>${idx}</b></div><div class="stat"><span>Goals</span><b>${state.gameLog.reduce((n,g)=>n+(g.stats.goals||0),0)}</b></div><div class="stat"><span>Assists</span><b>${state.gameLog.reduce((n,g)=>n+(g.stats.assists||0),0)}</b></div><div class="stat"><span>Ground balls</span><b>${state.gameLog.reduce((n,g)=>n+(g.stats.gb||0),0)}</b></div><div class="stat"><span>Recent performance</span><b>${state.gameLog.length?state.gameLog[0].grade+'/10':'—'}</b></div><div class="notice">Position changes the stat line: goalies get saves and save percentage; FOGOs get faceoff wins; defense/LSM get caused turnovers and ground balls; attack/midfield get goals, assists and turnovers.</div></div></div>`;let b=document.getElementById('playNext');if(b)b.onclick=playNextGame;let ns=document.getElementById('newSeason');if(ns)ns.onclick=()=>{state.gamesPlayed=0;state.gameLog=[];state.trainingThisWeek=0;state.day++;log('New season schedule released.');save();render()}}
function playNextGame(){if(!state.created){show('player');return}let idx=state.gamesPlayed||0,g=SCHEDULE[idx],p=state.player,stat=p.stats,avg=ratings(),strength=g[2],variance=Math.random()*22-11,grade=Math.max(2,Math.min(10,Math.round((avg-45)/6+variance/5+strength/2)));let stats={goals:0,assists:0,gb:0,ct:0,saves:0,faceoffs:0,turnovers:0};let pos=p.position;if(pos==='Goalie'){stats.saves=Math.max(4,Math.round((stat.Reactions+stat.Positioning)/22+Math.random()*8));stats.goalsAgainst=Math.max(3,Math.round(17-(stat['Angle Play']+stat.Hands)/13+Math.random()*7));stats.savePct=+(stats.saves/(stats.saves+stats.goalsAgainst)).toFixed(3)}else if(pos==='FOGO'){stats.faceoffs=Math.max(5,Math.round(14+(stat.Faceoffs-70)/3+(Math.random()*8-4)));stats.faceoffWins=Math.max(0,Math.min(stats.faceoffs,Math.round(stats.faceoffs*(.38+(stat.Clamps-60)/130+(Math.random()-.5)*.18))));stats.gb=Math.max(0,Math.round(stats.faceoffWins*.35+Math.random()*4));stats.goals=Math.random()<.35?1:0}else if(pos==='Defense'||pos==='LSM'){stats.gb=Math.max(1,Math.round((stat['Ground Balls']+stat.Speed)/35+Math.random()*4));stats.ct=Math.max(0,Math.round((stat['Stick Checks']+stat['On-Ball Defense']+stat['Slide IQ'])/65+Math.random()*2-1));stats.turnovers=Math.random()<.3?1:0}else{stats.goals=Math.max(0,Math.round((stat.Shooting+stat.Finishing||stat.Shooting+stat.Dodging)/42-1+Math.random()*3));stats.assists=Math.max(0,Math.round((stat.Passing+stat['Lacrosse IQ'])/58-1+Math.random()*2));stats.gb=Math.max(0,Math.round((stat.Speed+stat['Lacrosse IQ'])/45+Math.random()*2));stats.turnovers=Math.max(0,Math.round(Math.random()*2+(stat.Dodging<65?1:0)))}let opponentGoals=Math.max(4,Math.round(10+strength*1.2+Math.random()*6-(avg-70)/8)),yourGoals=pos==='Goalie'?Math.max(4,Math.round(12+Math.random()*4-(stats.goalsAgainst-7)/2)):Math.max(3,Math.round(8+(avg-65)/7+Math.random()*7));let win=yourGoals>opponentGoals;let result=`${win?'W':'L'} ${yourGoals}-${opponentGoals}`;let logEntry={event:g[0],result,grade,stats,opponent:g[1]};state.gameLog.unshift(logEntry);state.gameLog=state.gameLog.slice(0,8);state.gamesPlayed=idx+1;state.day+=1;state.trainingThisWeek=0;let strong=grade>=8;let interestBump=strong?5+Math.floor(Math.random()*9):grade>=6?1+Math.floor(Math.random()*4):0;if(interestBump){let candidates=SCHOOLS.map((s,i)=>({s,i,x:state.interest[i]})).filter(c=>c.x>20||c.s[1]==='D-III').sort((a,b)=>b.x-a.x).slice(0,8);if(candidates.length){let c=candidates[Math.floor(Math.random()*Math.min(4,candidates.length))];state.interest[c.i]=Math.min(99,state.interest[c.i]+interestBump);if(strong&&Math.random()<.45)state.messages.unshift({school:c.s[0],incoming:true,text:`We watched your recent ${g[0].toLowerCase()} performance. The staff liked what it saw. Please send your next schedule and latest film.`})}}p.exposure=Math.min(100,p.exposure+(strong?5:grade>=6?2:0));log(`${g[0]}: ${result}. Performance grade ${grade}/10.`);recalc();if(strong)maybeCoachCall('game',Math.random()<.45);save();render();showResult(`${g[0]}: ${result}`,`Performance grade: ${grade}/10. ${pos==='Goalie'?`Saves: ${stats.saves}; goals against: ${stats.goalsAgainst}; save percentage: ${(stats.savePct*100).toFixed(1)}%.`:pos==='FOGO'?`Faceoffs: ${stats.faceoffWins}/${stats.faceoffs}; ground balls: ${stats.gb}.`:pos==='Defense'||pos==='LSM'?`Ground balls: ${stats.gb}; caused turnovers: ${stats.ct}; turnovers: ${stats.turnovers}.`:`Goals: ${stats.goals}; assists: ${stats.assists}; ground balls: ${stats.gb}; turnovers: ${stats.turnovers}.`} ${strong?'A standout performance may draw new attention.':grade<5?'You need a stronger performance to move recruiting interest.':'A solid performance — keep building your film and consistency.'}`)}

function recalc(){SCHOOLS.forEach((s,i)=>{let old=state.interest[i]||0;let drift=(ratings()-72)*.4+p.exposure*.05+(p.gpa-3)*2;state.interest[i]=Math.max(0,Math.min(99,Math.round(old*.92+schoolInterest(i)*.08+drift*.04)));if(state.interest[i]>=88&&!state.offers.includes(s[0])&&Math.random()<.035){state.offers.push(s[0]);state.messages.unshift({school:s[0],incoming:true,text:`The staff wants to talk about your recruiting status. They are seriously evaluating you.`});log(`${s[0]} entered offer-level interest.`)}})}
function renderFilm(){let p=state.player;document.getElementById('film').innerHTML=header('EXPOSURE','Film room','Film is not a magic exposure button. You submit a specific game or highlight package; coaches evaluate the context, your position, performance and level of competition.')+`<div class="two-col"><div class="panel"><h3>Submit film to college staffs</h3><div class="field"><label>Film package</label><select id="filmType"><option value="full">Full game film</option><option value="highlights">Highlight reel</option><option value="position">Position-specific clips</option><option value="showcase">Showcase / tournament film</option></select></div><div class="field" style="margin-top:10px"><label>Film title / event</label><input id="filmTitle" placeholder="e.g. vs. La Salle — 3 goals, 2 assists"></div><div class="field" style="margin-top:10px"><label>What does the film show?</label><select id="filmEvidence"><option value="recent">Most recent game performance</option><option value="strong">One of my best performances</option><option value="fundamentals">Fundamentals and off-ball play</option><option value="athletic">Athleticism / transition plays</option></select></div><div class="field" style="margin-top:10px"><label>Send to</label><select id="filmSchool"><option value="all">All schools currently tracking me</option>${SCHOOLS.map((s,i)=>`<option value="${i}">${s[0]} (${s[1]})</option>`).join('')}</select></div><p class="sub">This simulator models the submission and coach evaluation; it does not host or upload a real video file. Add your actual Hudl / YouTube link to the film title if you want to track it.</p><button class="btn red" id="submitFilm">Submit film package</button></div><div class="panel"><div class="tiny">Recruiting profile</div><div class="num">${p.filmLog?.length||state.filmLog.length} submissions</div><div class="rule"></div><div class="tiny">Exposure level</div><div class="num">${p.exposure}/100</div><div class="meter red"><i style="width:${p.exposure}%"></i></div><div class="rule"></div><div class="sub">Exposure is only one piece. Film can help when it shows strong decisions and position-specific skills against credible competition. A generic upload alone should not create an offer.</div></div></div><div class="rule"></div><div class="panel"><h3>Film submission history</h3>${state.filmLog.length?`<table class="table"><thead><tr><th>Day</th><th>Package</th><th>Event / title</th><th>Sent to</th><th>Evaluation</th></tr></thead><tbody>${state.filmLog.map(f=>`<tr><td>${f.day}</td><td>${esc(f.type)}</td><td><b>${esc(f.title)}</b></td><td>${esc(f.to)}</td><td>${esc(f.result)}</td></tr>`).join('')}</tbody></table>`:'<div class="sub">No film has been submitted. Your first package will appear here, along with the staffs that received it and any response.</div>'}</div>`;document.getElementById('submitFilm').onclick=()=>{if(!state.created){show('player');return}let type=document.getElementById('filmType').value,title=document.getElementById('filmTitle').value.trim(),evidence=document.getElementById('filmEvidence').value,to=document.getElementById('filmSchool').value;if(!title){document.getElementById('filmTitle').focus();document.getElementById('filmTitle').placeholder='Enter a real event or film title first';return}let targets=to==='all'?SCHOOLS.map((s,i)=>({s,i})).filter(c=>(state.interest[c.i]||0)>=20).slice(0,12):[{s:SCHOOLS[+to],i:+to}];if(!targets.length)targets=SCHOOLS.map((s,i)=>({s,i})).sort((a,b)=>(state.interest[b.i]||0)-(state.interest[a.i]||0)).slice(0,5);let performance=evidence==='strong'?2:evidence==='recent'?(state.gameLog[0]?.grade>=8?2:state.gameLog[0]?.grade>=6?1:0):evidence==='fundamentals'?1:0;let result=performance===2?'Strong evaluation':performance===1?'Useful evaluation':'Logged; limited immediate movement';let gained=performance===2?5+Math.floor(Math.random()*5):performance===1?2+Math.floor(Math.random()*3):1;state.filmLog.unshift({day:state.day,type:document.getElementById('filmType').selectedOptions[0].text,title,to:to==='all'?'Tracking schools':SCHOOLS[+to][0],result});state.player.film++;state.player.exposure=Math.min(100,state.player.exposure+gained);state.day++;targets.forEach(c=>{let needBonus=c.s[1]==='D-III'?2:0;let bump=performance===2?4+Math.floor(Math.random()*6)+needBonus:performance===1?2+Math.floor(Math.random()*3):Math.random()<.25?1:0;state.interest[c.i]=Math.min(99,(state.interest[c.i]||0)+bump);if(bump>=5){state.messages.unshift({school:c.s[0],incoming:true,text:`Our staff reviewed your ${document.getElementById('filmType').selectedOptions[0].text.toLowerCase()} titled “${title}.” We liked what we saw. Please send your upcoming schedule and keep us updated.`})}});log(`Submitted ${type} film: ${title}. ${result}.`);maybeCoachCall('film');save();render();showResult('Film package submitted',`${title}. ${result}. Exposure increased by ${gained}. ${targets.length} program(s) received it. The response depended on the evidence selected and the recruiting fit; it did not automatically create an offer.`)};}

function renderVisits(){document.getElementById('visits').innerHTML=header('TRAVEL','Visits','Visits are relationship events. They can turn anonymous interest into a real recruiting relationship.')+`<div class="panel"><h3>Visit history</h3>${state.visits.length?`<table class="table"><thead><tr><th>School</th><th>Day</th><th>Status</th></tr></thead><tbody>${state.visits.map(v=>`<tr><td><b>${v.school}</b></td><td>${v.d}</td><td><span class="pill good">REQUESTED / LOGGED</span></td></tr>`).join('')}</tbody></table>`:'<div class="notice">No visits yet. Open a school file from the recruiting board and request one.</div>'}</div>`}
function renderColleges(){document.getElementById('colleges').innerHTML=header('DIRECTORY','College directory','A built-in D-I through D-III database so the simulator does not force you into one level of lacrosse.')+`<div class="panel"><table class="table"><thead><tr><th>Program</th><th>Division</th><th>Conference</th><th>Location</th><th>Program level</th><th>Academic emphasis</th></tr></thead><tbody>${SCHOOLS.map(s=>`<tr><td><b>${s[0]}</b></td><td><span class="pill ${s[1].toLowerCase().replace('-','')}">${s[1]}</span></td><td>${s[2]}</td><td>${s[3]}</td><td>${s[4]}/5</td><td>${s[6]}</td></tr>`).join('')}</tbody></table></div>`}
if(!Object.keys(state.player.stats).length)initStats();document.getElementById('resetBtn').onclick=()=>{if(confirm('Reset the entire recruiting save?')){localStorage.removeItem('laxr_save');location.reload()}};document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};render();
</script></body></html>
