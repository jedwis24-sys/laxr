function newThread(name,kind,schoolId,initial){let canonical=schoolId!==null&&schoolId!==undefined&&kind==='coach'?PROGRAMS[schoolId][0]+' · Recruiting':name;let t=state.threads.find(x=>x.name===canonical||(schoolId!==null&&schoolId!==undefined&&x.kind==='coach'&&x.schoolId===schoolId));if(t){if(initial)pushMsg(t.id,'them',initial);return t}t={id:'t'+Date.now()+Math.random().toString(16).slice(2,6),name:canonical,kind,schoolId,unread:0,messages:[]};state.threads.unshift(t);if(initial)pushMsg(t.id,'them',initial);return t}function pushMsg(id,from,text){let t=state.threads.find(x=>x.id===id);if(!t)return;t.messages.push({from,text,day:state.calendarDay,time:'Day '+state.calendarDay});if(from==='them')t.unread=(t.unread||0)+1;state.activeThread=id;save()}
function boot(){if(!state||!state.player||!state.season)state=fresh();if(!state.created){renderCreate();return}renderAll();showView('dashboard')}
function renderCreate(){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$('dashboard').classList.add('active');$('dashboard').innerHTML=`<div class="pagehead"><div><div class="eyebrow">NEW CAREER FILE · CLASS OF 2028</div><h1>Build your path.</h1><p>Start at the end of sophomore year, build film in the playoffs, play summer club, then work through junior and senior seasons.</p></div></div><div class="hero" style="margin-bottom:16px"><div><div class="eyebrow">FIELDHOUSE CAREER MODE</div><h2>Your season.<br>Your recruitment.</h2><p>Play the full high school season, improve after every game, rise in the rankings, and earn the right college's attention. Your career ends when you commit.</p><span class="badge lime">SAVE FILE STORED IN THIS BROWSER</span></div><div class="hero-side"><div class="hero-rating">01<small>CREATE YOUR PLAYER</small></div><p>Don't overthink every detail. You can update your profile as the career develops.</p></div></div><div class="panel"><h2>Player setup</h2><form id="createForm"><div class="formgrid"><div class="field"><label>Player name</label><input name="name" required placeholder="First and last name"></div><div class="field"><label>Position</label><select name="position">${POSITIONS.map(p=>`<option>${p}</option>`).join('')}</select></div><div class="field"><label>Hometown</label><input name="hometown" required placeholder="Town, State"></div><div class="field"><label>High school</label><select name="highSchool">${HSS.map(s=>`<option>${s[0]}</option>`).join('')}</select></div><div class="field"><label>School type</label><select name="schoolType"><option>Private</option><option>Public</option></select></div><div class="field"><label>School profile</label><select name="schoolStrength"><option>Powerhouse</option><option>Competitive</option><option>Under-the-radar</option></select></div><div class="field"><label>Club team</label><select name="club">${CLUBS.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>Graduation class</label><select name="classYear"><option>2027</option><option selected>2028</option><option>2029</option></select></div><div class="field"><label>Handedness</label><select name="hand"><option>Right</option><option>Left</option></select></div></div><div class="divider"></div><button class="btn lime" type="submit">Start sophomore playoffs →</button></form></div>`;$('createForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);state=fresh();state.created=true;for(let k of ['name','position','hometown','highSchool','schoolType','schoolStrength','club','hand'])state.player[k]=f.get(k);state.player.classYear=+f.get('classYear');let base=state.player.schoolStrength==='Powerhouse'?69:state.player.schoolStrength==='Competitive'?64:59;state.player.stats={};ATTRS[state.player.position].forEach((a,i)=>state.player.stats[a]=Math.max(42,Math.min(86,base+Math.floor(Math.random()*12)-5+(a==='Lacrosse IQ'?3:0))));state.player.iq=state.player.stats['Lacrosse IQ']||60;state.season.phase='sophomore_playoffs';state.season.year='Sophomore';state.season.schedule=makeShortPlayoffs('Sophomore');state.season.week=1;state.activity=[{day:1,text:'Sophomore playoff run started at '+state.player.highSchool+'.'}];PROGRAMS.forEach((s,i)=>ensureProgram(i));act('Player profile created.');seedInitialMessages();save();renderAll();showView('dashboard');toast('Career started. Your player file is ready.')}}
function makeSchedule(){let opp=['Rival High','County Prep','North Academy','Westfield','Valley Catholic','Eastside','Central High','Summit School','Lakeside','Regional Prep','Bishop Academy','State-ranked opponent','League rival','Conference contender'];let a=[];for(let i=0;i<14;i++)a.push({week:i+1,opponent:opp[i],type:i===0?'League':i===5?'Rivalry':i===10?'League':'Regular season',played:false,result:null});return a}

function renderAll(){if(!state.created){renderCreate();return}renderDashboard();renderPlayer();renderSeason();renderDevelopment();renderRankings();renderSchools();renderMessages();renderVisits();renderSettings();save()}
function pagehead(k,t,p,action=''){return `<div class="pagehead"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p>${p}</p></div>${action}</div>`}
function renderDashboard(){let p=state.player,s=state.season,played=s.game,rec=state.offers.length,rank=natRank();$('dashboard').innerHTML=pagehead('CAREER OVERVIEW','The road to September 9.','Build your film, climb the rankings, and make colleges compete for your commitment.',`<button class="btn lime" onclick="showView('season')">Next game →</button>`)+`<div class="hero"><div><div class="eyebrow">${esc(p.highSchool)} · ${esc(p.club)}</div><h2>${esc(p.name)}</h2><p>${esc(p.position)} · Class of ${p.classYear} · ${esc(p.hometown)}<br>Your recruiting story starts with the next rep. Every game adds a little development; standout performances can accelerate exposure.</p><div class="row"><span class="badge lime">${esc(p.schoolStrength)}</span><span class="badge dark">${s.wins}-${s.losses} RECORD</span><span class="badge dark">${rec} OFFERS</span></div></div><div class="hero-side"><div class="hero-rating">${avg()}<small>PLAYER RATING</small></div><div class="divider" style="background:#3d443e"></div><div class="row" style="justify-content:space-between"><span class="muted">National class rank</span><b>#${rank}</b></div><div class="row" style="justify-content:space-between;margin-top:8px"><span class="muted">Position rank</span><b>#${posRank()}</b></div><div class="row" style="justify-content:space-between;margin-top:8px"><span class="muted">Film rating</span><b>${p.film}/100</b></div></div></div><div class="grid g4" style="margin-top:14px"><div class="panel"><div class="tiny">Season games</div><div class="metric">${played}<span style="font-size:14px;color:#858b81"> / ${s.schedule.length}</span></div><div class="metric-label">${s.wins} wins · ${s.losses} losses</div></div><div class="panel"><div class="tiny">Goals + assists</div><div class="metric">${s.goals+s.assists}</div><div class="metric-label">${s.goals} goals · ${s.assists} assists</div></div><div class="panel"><div class="tiny">College interest</div><div class="metric">${PROGRAMS.filter((_,i)=>interest(i)>=55).length}</div><div class="metric-label">Programs tracking you</div></div><div class="panel"><div class="tiny">Offers</div><div class="metric">${state.offers.length}</div><div class="metric-label">Open your offer board</div></div></div><div class="grid g2" style="margin-top:14px"><div class="panel"><div class="row" style="justify-content:space-between"><h2>Next on the calendar</h2><span class="badge">WEEK ${s.week}</span></div>${nextGameHtml()}<div class="divider"></div><div class="row"><button class="btn" onclick="playNextGame()">Play next game</button><button class="btn ghost" onclick="showView('season')">View full schedule</button></div></div><div class="panel"><div class="row" style="justify-content:space-between"><h2>Latest activity</h2><span class="tiny">CAREER LOG</span></div>${(state.activity||[]).slice(0,5).map(a=>`<div class="activity" style="margin:12px 0"><div class="activity-icon">↗</div><div><strong>${esc(a.text)}</strong><small>Career day ${a.day}</small></div></div>`).join('')||'<div class="empty">Your career activity will show here.</div>'}</div></div><div class="notice" style="margin-top:14px">Recruiting tip: Film and exposure matter, but roster needs and the number of committed recruits affect how much room a program has for you.</div>`}
function nextGameHtml(){let g=state.season.schedule.find(g=>!g.played);return g?`<div class="schedule-card"><div class="datebox"><small>WEEK</small><b>${g.week}</b></div><div style="flex:1"><strong>${esc(g.opponent)}</strong><div class="muted" style="font-size:11px">${g.type} · High school season</div></div><span class="badge lime">UP NEXT</span></div>`:`<div class="empty"><strong>Regular season complete</strong>You've finished your scheduled high school games.</div>`}
function renderPlayer(){let p=state.player;$('player').innerHTML=pagehead('ATHLETE FILE','Player profile','Your identity, recruiting profile, and position-specific attribute card.')+`<div class="grid g2"><div class="panel"><div class="row" style="justify-content:space-between"><div><div class="tiny">${esc(p.highSchool)} · ${esc(p.club)}</div><h2 style="font-size:25px;margin:6px 0">${esc(p.name)}</h2><div class="muted">${esc(p.position)} · ${esc(p.hometown)}</div></div><div class="hero-rating" style="color:var(--ink);font-size:45px">${avg()}<small style="color:var(--muted)">OVR</small></div></div><div class="divider"></div><div class="grid g2"><div><div class="tiny">Class</div><b>${p.classYear}</b></div><div><div class="tiny">Handedness</div><b>${esc(p.hand)}</b></div><div><div class="tiny">School type</div><b>${esc(p.schoolType)} · ${esc(p.schoolStrength)}</b></div><div><div class="tiny">Club team</div><b>${esc(p.club)}</b></div></div><div class="divider"></div><button class="btn ghost" onclick="editProfile()">Edit player details</button></div><div class="panel"><h2>Position attributes</h2>${ATTRS[p.position].map(a=>`<div class="statline"><span>${esc(a)}</span><b>${p.stats[a]||60}</b></div><div class="bar"><span style="width:${p.stats[a]||60}%"></span></div>`).join('')}<p class="muted" style="font-size:11px;margin:14px 0 0">Attributes improve gradually after games. Strong performances and film sessions can add extra growth.</p></div></div>`}
function renderSeason(){let s=state.season;$('season').innerHTML=pagehead('HIGH SCHOOL SEASON','Schedule & results','Play every game in the season. Results shape your stats, development, film, and recruiting visibility.')+`<div class="grid g3" style="margin-bottom:14px"><div class="panel"><div class="tiny">Record</div><div class="metric">${s.wins}-${s.losses}</div></div><div class="panel"><div class="tiny">Games played</div><div class="metric">${s.game}/${s.schedule.length}</div></div><div class="panel"><div class="tiny">Season production</div><div class="metric">${s.goals}G · ${s.assists}A</div></div></div><div class="panel"><div class="row" style="justify-content:space-between"><h2>Junior season schedule</h2><span class="badge">14 GAMES</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Week</th><th>Opponent</th><th>Game type</th><th>Result</th><th>Your line</th><th></th></tr></thead><tbody>${s.schedule.map((g,i)=>`<tr><td>${g.week}</td><td class="school-name">${esc(g.opponent)}</td><td>${esc(g.type)}</td><td>${g.played?`<b>${g.result}</b>`:'<span class="muted">Upcoming</span>'}</td><td>${g.line?esc(g.line):'—'}</td><td>${g.played?'<span class="badge">FINAL</span>':i===s.schedule.findIndex(x=>!x.played)?`<button class="btn lime" onclick="playNextGame()">Play</button>`:'<span class="muted">Scheduled</span>'}</td></tr>`).join('')}</tbody></table></div><div class="divider"></div><div class="row"><button class="btn lime" onclick="playNextGame()" ${s.schedule.every(g=>g.played)?'disabled':''}>Play next game →</button><button class="btn ghost" onclick="summerEvent()">Summer showcase / club event</button><button class="btn ghost" onclick="prospectDay()">Prospect day</button></div></div><div class="panel" style="margin-top:14px"><h2>Postseason & exposure</h2><p class="muted">Finish the regular season to unlock league and state playoff rounds. Rivalry games, playoff wins, and summer events can raise your exposure and create more film.</p><div class="row"><span class="badge">League playoffs: ${s.game>=10?'Eligible':'Unlocks late season'}</span><span class="badge">State playoffs: ${s.game>=14?'Available':'Finish regular season'}</span><span class="badge">Rivalry: Week 6</span></div></div>`}
function playNextGame(){let g=state.season.schedule.find(x=>!x.played);if(!g){toast('Regular season finished. Playoffs unlock from the season panel.');return}openModal(`<button class="close" onclick="closeModal()">Close</button><div class="eyebrow">WEEK ${g.week} · ${esc(g.type)}</div><h2>Game day: ${esc(g.opponent)}</h2><p class="muted">Pick your approach. The game simulates around your choices, with your attributes influencing the result.</p><div class="moment"><b>How are you playing today?</b><div class="row" style="margin-top:12px"><button class="btn lime" onclick="resolveGame('aggressive')">Attack the matchup</button><button class="btn" onclick="resolveGame('balanced')">Play your game</button><button class="btn ghost" onclick="resolveGame('team')">Make teammates better</button></div><p>Attack = higher scoring upside. Balanced = steady all-around line. Team-first = more passing and team impact.</p></div>`)}
function resolveGame(style){closeModal();let s=state.season,g=s.schedule.find(x=>!x.played),p=state.player;if(!g)return;let ovr=avg(),fat=state.training.fatigue||0;let base=style==='aggressive'?1.7:style==='team'?1.15:1.35;let stat=style==='aggressive'?(p.stats.Shooting||p.stats['On-ball Defense']||ovr):(style==='team'?(p.stats.Passing||ovr):ovr);let performance=Math.max(.25,Math.min(2.5,(stat/70)*base-fat/130+(Math.random()*.7-.2)));let goals=0,assists=0,gb=0,caused=0,saves=0;if(p.position==='Goalie'){saves=Math.max(3,Math.round(5+performance*5+Math.random()*4));}else{goals=Math.max(0,Math.round((style==='aggressive'?1.2:.65)*performance+Math.random()*1.1-.3));assists=Math.max(0,Math.round((style==='team'?1.35:.7)*performance+Math.random()*.9-.2));gb=Math.max(0,Math.round(performance+Math.random()*2));if(['Close Defense','LSM'].includes(p.position))caused=Math.max(0,Math.round(performance+Math.random()*.8-.3));}let teamScore=Math.max(4,Math.round(7+performance*2+Math.random()*5));let oppScore=Math.max(3,Math.round(7+Math.random()*6+(g.week%4===0?1:0)));if(g.week===6){oppScore+=1;g.type='Rivalry';}let win=teamScore>oppScore;if(teamScore===oppScore)teamScore++;win=teamScore>oppScore;s.game++;s.week=g.week+1;s.goals+=goals;s.assists+=assists;s.gb+=gb;s.caused+=caused;s.saves+=saves;if(win)s.wins++;else s.losses++;g.played=true;g.result=`${teamScore}-${oppScore}`;g.line=p.position==='Goalie'?`${saves} SV`:`${goals} G · ${assists} A · ${gb} GB${caused?' · '+caused+' CT':''}`;s.lastResult={opponent:g.opponent,score:g.result,win,goals,assists,gb,caused,saves,performance,style};state.calendarDay+=7;state.training.fatigue=Math.min(90,state.training.fatigue+16);state.training.actionsThisWeek=0;let attrs=ATTRS[p.position];attrs.forEach(a=>{let gain=.35+Math.random()*.35;if(a==='Lacrosse IQ')gain+=.2;if(performance>1.45)gain+=.25;p.stats[a]=Math.min(99,Math.round(((p.stats[a]||60)+gain)*10)/10)});p.iq=Math.min(99,(p.stats['Lacrosse IQ']||p.iq||60));p.film=Math.min(100,p.film+(performance>1.35?3:1));p.exposure=Math.min(100,p.exposure+(performance>1.5?4:2)+(g.type==='Rivalry'?2:0));act(`${win?'Beat':'Lost to'} ${g.opponent}, ${g.result}. ${goals} goals, ${assists} assists; player development increased.`);recruitingTick(g,performance);save();renderAll();showView('season');openModal(`<div class="eyebrow">FINAL · WEEK ${g.week}</div><h2>${win?'Win.':'Final score.'} ${esc(g.result)}</h2><p class="muted">${esc(g.opponent)} · ${g.type}</p><div class="grid g3"><div class="panel"><div class="tiny">Your goals</div><div class="metric">${goals}</div></div><div class="panel"><div class="tiny">Assists</div><div class="metric">${assists}</div></div><div class="panel"><div class="tiny">Ground balls</div><div class="metric">${gb}</div></div></div><div class="notice" style="margin:14px 0">Development update: your attributes rose a little after the game. Film is now ${p.film}/100 and exposure is ${p.exposure}/100.</div><div class="row"><button class="btn lime" onclick="closeModal();showView('season')">Continue season</button><button class="btn ghost" onclick="closeModal();showView('messages')">Check messages</button></div>`)}
function recruitingTick(g,perf){PROGRAMS.forEach((s,i)=>{let pr=ensureProgram(i);let fit=s[6].toLowerCase().includes(state.player.position.toLowerCase())?1.25:0.82;let bump=(perf>1.35?5:2)+(state.player.film>=25?2:0)+(g.type==='Rivalry'?2:0);pr.interest=Math.min(99,pr.interest+bump);let division=s[1],threshold=division==='D-I'?68:division==='D-II'?57:49,minRating=division==='D-I'?69:division==='D-II'?61:55;let rosterOpen=pr.committedRecruits<pr.need&&!pr.offer&&!state.offers.some(o=>o.school===s[0]);if(rosterOpen&&pr.interest>=threshold&&avg()>=minRating&&(fit>1||pr.interest>=threshold+8)){offerSchool(i)}else if(rosterOpen&&pr.interest>=threshold-7&&!state.threads.some(t=>t.kind==='coach'&&t.schoolId===i)){newThread(s[0]+' · Recruiting','coach',i,`Coach ${['Reed','Hawkins','Miller','Sullivan','Parker'][i%5]} here. We've started reviewing your film. Keep us posted on your summer schedule and upcoming games.`);act(s[0]+' opened a recruiting conversation.')}});if(g.week===9){PROGRAMS.forEach((s,i)=>{let pr=ensureProgram(i);pr.interest=Math.min(99,pr.interest+Math.round(state.player.exposure*.08));});act('September 9 recruiting contact window: college interest starts turning into conversations.')}}

function renderDevelopment(){let t=state.training,p=state.player;$('development').innerHTML=pagehead('PLAYER DEVELOPMENT','Build your game','Training is action-based, not an hours spreadsheet. Practice, lift, recover, and study film.')+`<div class="grid g3"><div class="panel"><div class="tiny">Fatigue</div><div class="metric">${t.fatigue}%</div><div class="bar"><span style="width:${t.fatigue}%;background:${t.fatigue>65?'var(--red)':'var(--dark)'}"></span></div><p class="muted" style="font-size:11px">High fatigue can reduce game performance.</p></div><div class="panel"><div class="tiny">Training sessions</div><div class="metric">${t.work}</div><div class="metric-label">Total completed</div></div><div class="panel"><div class="tiny">Film sessions</div><div class="metric">${t.film}</div><div class="metric-label">Film rating ${p.film}/100</div></div></div><div class="grid g2" style="margin-top:14px"><div class="panel"><h2>Training ground</h2><p class="muted">Pick an activity. No hour counting — each action has a clear effect.</p><div class="schedule-card"><div class="activity-icon">⌁</div><div style="flex:1"><b>Position practice</b><div class="muted" style="font-size:11px">Small boost to two position attributes; some fatigue.</div></div><button class="btn" onclick="train('practice')">Practice</button></div><div class="schedule-card"><div class="activity-icon">↗</div><div style="flex:1"><b>Strength & conditioning</b><div class="muted" style="font-size:11px">Build athletic attributes; higher fatigue.</div></div><button class="btn" onclick="train('weights')">Lift</button></div><div class="schedule-card"><div class="activity-icon">◷</div><div style="flex:1"><b>Recovery day</b><div class="muted" style="font-size:11px">Reduce fatigue so you're sharper next game.</div></div><button class="btn" onclick="train('rest')">Recover</button></div><div class="schedule-card"><div class="activity-icon">▤</div><div style="flex:1"><b>Film study</b><div class="muted" style="font-size:11px">Improve lacrosse IQ, film score, and exposure.</div></div><button class="btn" onclick="train('film')">Watch film</button></div></div><div class="panel"><h2>Development report</h2><div class="row" style="justify-content:space-between"><div><div class="tiny">Current rating</div><div class="metric">${avg()}</div></div><div><div class="tiny">Lacrosse IQ</div><div class="metric">${p.stats['Lacrosse IQ']||p.iq||60}</div></div></div><div class="divider"></div>${ATTRS[p.position].map(a=>`<div class="statline"><span>${esc(a)}</span><b>${Math.round(p.stats[a]||60)}</b></div><div class="bar"><span style="width:${p.stats[a]||60}%"></span></div>`).join('')}</div></div>`}
function train(type){let p=state.player,t=state.training;let attrs=ATTRS[p.position];t.actionsThisWeek=t.actionsThisWeek||0;if(t.actionsThisWeek>=3){toast('You have used your 3 development sessions before the next game. Play the next game to reset them.');return}t.actionsThisWeek++; if(type==='practice'){for(let a of attrs.slice(0,3))p.stats[a]=Math.min(99,Math.round(((p.stats[a]||60)+.6+Math.random()*.7)*10)/10);p.stats['Lacrosse IQ']=Math.min(99,(p.stats['Lacrosse IQ']||p.iq||60)+.4);t.fatigue=Math.min(100,t.fatigue+10);t.work++;act('Completed position practice.')}if(type==='weights'){let a=['Speed','Strength','Quickness','Acceleration'].find(x=>attrs.includes(x))||attrs[0];p.stats[a]=Math.min(99,Math.round(((p.stats[a]||60)+1.2)*10)/10);t.fatigue=Math.min(100,t.fatigue+18);t.work++;act('Completed strength and conditioning.')}if(type==='rest'){t.fatigue=Math.max(0,t.fatigue-32);act('Took a recovery day and reduced fatigue.')}if(type==='film'){p.film=Math.min(100,p.film+5);p.exposure=Math.min(100,p.exposure+1);p.stats['Lacrosse IQ']=Math.min(99,Math.round(((p.stats['Lacrosse IQ']||p.iq||60)+1.2)*10)/10);p.iq=p.stats['Lacrosse IQ'];t.film++;t.fatigue=Math.max(0,t.fatigue-4);act('Completed film study. Film and lacrosse IQ improved.')}t.fatigue=Math.round(t.fatigue);save();renderAll();showView('development');toast('Development updated.')}
function renderRankings(){let p=state.player;$('rankings').innerHTML=pagehead('EXPOSURE & PLAYER EVALUATION','Rankings & film','Build a recruiting profile through film, performance, club events, and prospect days.')+`<div class="grid g3"><div class="panel"><div class="tiny">National class ranking</div><div class="metric">#${natRank()}</div><div class="metric-label">Class of ${p.classYear}</div></div><div class="panel"><div class="tiny">Position ranking</div><div class="metric">#${posRank()}</div><div class="metric-label">${esc(p.position)} · national</div></div><div class="panel"><div class="tiny">Film / exposure</div><div class="metric">${p.film}<span style="font-size:15px;color:var(--muted)"> / 100</span></div><div class="bar lime"><span style="width:${p.exposure}%"></span></div><div class="metric-label" style="margin-top:8px">Exposure ${p.exposure}/100</div></div></div><div class="grid g2" style="margin-top:14px"><div class="panel"><h2>Recruiting profile</h2><p class="muted">This is the profile college staffs evaluate alongside their own scouting and roster needs.</p><div class="statline"><span>Player rating</span><b>${avg()}/100</b></div><div class="bar"><span style="width:${avg()}%"></span></div><div class="statline"><span>Film grade</span><b>${p.film}/100</b></div><div class="bar"><span style="width:${p.film}%"></span></div><div class="statline"><span>Exposure</span><b>${p.exposure}/100</b></div><div class="bar"><span style="width:${p.exposure}%"></span></div><div class="divider"></div><button class="btn lime" onclick="filmSession()">Build highlight film</button></div><div class="panel"><h2>Exposure opportunities</h2><div class="schedule-card"><div class="activity-icon">◉</div><div style="flex:1"><b>Summer club event</b><div class="muted" style="font-size:11px">Compete in front of college coaches.</div></div><button class="btn" onclick="summerEvent()">Attend</button></div><div class="schedule-card"><div class="activity-icon">◎</div><div style="flex:1"><b>Colle function filmSession(){state.training.actionsThisWeek=state.training.actionsThisWeek||0;if(state.training.actionsThisWeek>=3){toast('You have used your 3 development sessions before the next game.');return}state.training.actionsThisWeek++;state.player.film=Math.min(100,state.player.film+6);state.player.exposure=Math.min(100,state.player.exposure+3);act('Updated highlight film with recent clips.');PROGRAMS.forEach((s,i)=>{let pr=ensureProgram(i);pr.interest=Math.min(99,pr.interest+3)});save();renderAll();showView('rankings');toast('Highlight film improved.')}
function summerEvent(){state.calendarDay+=2;state.player.exposure=Math.min(100,state.player.exposure+8);state.player.film=Math.min(100,state.player.film+4);PROGRAMS.forEach((s,i)=>{let pr=ensureProgram(i);pr.interest=Math.min(99,pr.interest+(s[4]>=85?8:5));if(pr.interest>=46&&!pr.offer&&pr.committedRecruits<pr.need&&!state.threads.some(t=>t.kind==='coach'&&t.schoolId===i)){newThread(s[0]+' · Recruiting','coach',i,`We saw you compete this weekend and would like to keep evaluating you. Can you send over your updated film and summer schedule?`);}});act('Attended a summer club showcase. Exposure and film increased.');save();renderAll();toast('Showcase complete. Coaches took notice.')}
function prospectDay(){let options=PROGRAMS.map((s,i)=>({s,i})).filter(x=>interest(x.i)>40).sort((a,b)=>interest(b.i)-interest(a.i)).slice(0,8);openModal(`<button class="close" onclick="closeModal()">Close</button><h2>Choose a prospect day</h2><p class="muted">Attend a school that's showing interest. Visiting can deepen the relationship, but it doesn't guarantee an offer.</p>${options.map(({s,i})=>`<div class="schedule-card"><div style="flex:1"><b>${esc(s[0])}</b><div class="muted" style="font-size:11px">${s[1]} · ${s[2]} · Interest ${interest(i)}%</div></div><button class="btn" onclick="attendProspect(${i})">Visit</button></div>`).join('')||'<div class="empty">No programs are tracking you yet. Build film and exposure first.</div>'}`)}function attendProspect(i){closeModal();let s=PROGRAMS[i],pr=ensureProgram(i);pr.interest=Math.min(99,pr.interest+10);pr.visit=true;state.visits.unshift({school:s[0],day:state.calendarDay,status:'Completed',note:'Met coaching staff and toured facilities.'});newThread(s[0]+' · Recruiting','coach',i,`Thanks for coming to campus. It was good meeting you and talking through how you might fit our program. Keep us updated on your season.`);act('Visited '+s[0]+', met coaches, and toured facilities.');save();renderAll();showView('visits');toast('Visit logged.')}
function sendFilm(){let list=PROGRAMS.map((s,i)=>({s,i})).filter(x=>interest(x.i)>35).sort((a,b)=>interest(b.i)-interest(a.i)).slice(0,10);list.forEach(({s,i})=>{let pr=ensureProgram(i);pr.interest=Math.min(99,pr.interest+5);if(!state.threads.some(t=>t.kind==='coach'&&t.schoolId===i)&&pr.interest>=42)newThread(s[0]+' · Recruiting','coach',i,'Thanks for sending your film. Our staff will review it against our current position needs and follow up about next steps.');});state.player.film=Math.min(100,state.player.film+2);act('Sent updated film to interested programs.');save();renderAll();toast('Film sent to interested programs.')}
function renderSchools(){let filter=window.schoolFilter||'All';let arr=PROGRAMS.map((s,i)=>({s,i,pr:ensureProgram(i),int:interest(i)})).filter(x=>filter==='All'||x.s[1]===filter).sort((a,b)=>b.int-a.int);$('schools').innerHTML=pagehead('COLLEGE DATABASE','Your college board','Programs evaluate film, rankings, location, position needs, and their remaining recruiting spots.')+`<div class="row" style="justify-content:space-between;margin-bottom:14px"><div class="pillbar">${['All','D-I','D-II','D-III'].map(f=>`<button class="pillbtn ${filter===f?'active':''}" onclick="schoolFilter='${f}';renderSchools()">${f==='All'?'All programs':f}</button>`).join('')}</div><span class="tiny">${arr.length} PROGRAMS</span></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Program</th><th>Division / conference</th><th>Program strength</th><th>Position need</th><th>Interest</th><th>Roster room</th><th>Action</th></tr></thead><tbody>${arr.map(({s,i,pr,int})=>`<tr><td><div class="school-name">${esc(s[0])}</div><div class="school-sub">${esc(s[3])}</div></td><td><span class="badge">${s[1]}</span><div class="school-sub">${esc(s[2])}</div></td><td><b>${s[4]}/100</b></td><td>${esc(s[6])}</td><td style="min-width:110px"><div class="statline" style="margin:0 0 5px"><b>${int}%</b><span class="muted">${int>=70?'Tracking':int>=45?'Watching':'Limited'}</span></div><div class="bar"><span style="width:${int}%"></span></div></td><td>${Math.max(0,pr.need-pr.committedRecruits)} spots</td><td>${pr.offer||state.offers.some(o=>o.school===s[0])?'<span class="badge lime">OFFER</span>':`<button class="btn ghost" onclick="contactSchool(${i})">Contact</button>`}</td></tr>`).join('')}</tbody></table></div></div><p class="muted" style="font-size:11px;margin-top:12px">Program ratings and roster counts are game simulation values, not current official roster data. Verify NCAA division and recruiting rules before treating this as a factual directory.</p>`}
function contactSchool(i){let s=PROGRAMS[i],pr=ensureProgram(i);if(pr.committedRecruits>=pr.need){toast('That program has very limited room at the moment.');return}let msg=pr.interest>60?`Coach ${['Miller','Sullivan','Reed','Hawkins'][i%4]} here. Thanks for reaching out. We've been following your film. Let's set up a call to talk about your role and our program.`:`Thanks for introducing yourself. Send us your best film and summer schedule. Our staff will review it against our current recruiting needs.`;let t=newThread(s[0]+' · Recruiting','coach',i,msg);pr.lastContact=state.calendarDay;pr.interest=Math.min(99,pr.interest+8);act('Contacted '+s[0]+' about recruiting.');save();renderAll();showView('messages');state.activeThread=t.id;renderMessages();toast('Conversation started with '+s[0]+'.')}
function renderMessages(){let threads=state.threads||[];let active=threads.find(t=>t.id===state.activeThread)||threads[0];if(active)state.activeThread=active.id;$('messages').innerHTML=pagehead('COMMUNICATIONS','Messages','Persistent conversations with coaches and recruits. Messages stay in one thread, and recruiting details carry forward.')+`<div class="inbox"><div class="thread-list"><div class="thread-list-head">Inbox <span class="muted" style="font-weight:500">· ${threads.length} chats</span></div>${threads.map(t=>`<div class="thread ${active&&t.id===active.id?'active':''}" onclick="openThread('${t.id}')"><div class="avatar">${esc(t.name.split(/[ ·]/)[0].slice(0,2).toUpperCase())}</div><div class="thread-body"><div class="thread-top"><span>${esc(t.name)}</span>${t.unread?`<span class="badge lime">${t.unread}</span>`:''}</div><div class="thread-preview">${esc(t.messages[t.messages.length-1]?.text||'No messages yet')}</div></div></div>`).join('')||'<div class="empty"><strong>Your inbox is quiet.</strong>College coaches and recruits will message you as your career develops.</div>'}</div><div class="chat">${active?`<div class="chat-head"><div class="avatar">${esc(active.name.slice(0,2).toUpperCase())}</div><div><strong>${esc(active.name)}</strong><small>${active.kind==='coach'?'Recruiting conversation':active.kind==='highschool'?'High school coach':'Recruiting class'}</small></div><span class="badge" style="margin-left:auto">ONGOING THREAD</span></div><div class="chat-messages" id="chatMessages">${active.messages.map(m=>`<div class="bubble ${m.from==='me'?'mine':'theirs'}">${esc(m.text)}<time>${esc(m.time||'Day '+m.day)}</time></div>`).join('')}</div><form class="chat-compose" id="chatForm"><input name="message" autocomplete="off" placeholder="Write a message…" required><button class="btn lime">Send</button></form>`:`<div class="empty"><strong>Select a conversation</strong>Choose a chat to read and reply.</div>`}</div></div>`;let cm=$('chatMessages');if(cm)cm.scroll function openThread(id){state.activeThread=id;let t=state.threads.find(x=>x.id===id);if(t)t.unread=0;save();renderMessages()}function coachReply(id,msg){let t=state.threads.find(x=>x.id===id);if(!t)return;let lower=String(msg||'').toLowerCase(),reply;if(t.kind==='coach'){if(/visit|campus|facility/.test(lower)){reply='Absolutely. We can arrange a visit so you can meet the staff, tour the facilities, and talk about where you fit in our recruiting plan.';let pr=Number.isInteger(t.schoolId)?ensureProgram(t.schoolId):null;if(pr){pr.interest=Math.min(99,pr.interest+5);pr.visit=true}}else if(/offer|scholarship|roster|role|playing time/.test(lower)){let pr=Number.isInteger(t.schoolId)?ensureProgram(t.schoolId):null;if(pr&&pr.offer)reply='We have extended an offer because we see a fit. Let’s set up a call to go over the offer and the role we envision for you.';else reply='We are still evaluating our board. Your film, position, and our roster needs all matter. Keep us updated on your schedule; we will be direct when we have a decision.';}else if(/film|highlight|video/.test(lower)){reply='Send the latest cut when you can. We are evaluating decision-making, off-ball play, and consistency—not just highlight plays.';let pr=Number.isInteger(t.schoolId)?ensureProgram(t.schoolId):null;if(pr)pr.interest=Math.min(99,pr.interest+4)}else if(/thank|appreciate/.test(lower))reply='Of course. Keep communicating with us and let us know when your schedule changes.';else reply='Thanks for the message. I’ll share this with our staff. We’re tracking your film and upcoming schedule, and we’ll follow up as our board develops.';}else if(t.kind==='recruit')reply=/commit|committed|offer|school/.test(lower)?'Still sorting it out. A couple schools are talking to me, but I want to see how the visits go before I decide.':'Yeah man, recruiting is moving fast. Let me know if you hear anything new from your side.';else reply='Keep working. We need consistent effort all season, and your film will tell the story.';pushMsg(id,'them',reply);state.activeThread=id;save();renderMessages()}

function renderVisits(){let offers=state.offers||[];$('visits').innerHTML=pagehead('RECRUITING DECISIONS','Offers & visits','Keep track of college interest, invitations, visits, and the decision to commit.')+`<div class="grid g2"><div class="panel"><div class="row" style="justify-content:space-between"><h2>Offer board</h2><span class="badge lime">${offers.length} OFFERS</span></div>${offers.length?offers.map(o=>`<div class="schedule-card"><div class="activity-icon">✦</div><div style="flex:1"><b>${esc(o.school)}</b><div class="muted" style="font-size:11px">${esc(o.division)} · Offer received on career day ${o.day}</div></div><button class="btn" onclick="commitTo('${esc(o.school)}')">Commit</button></div>`).join(''):'<div class="empty"><strong>No offers yet.</strong>Build film, perform in games, and reach out to programs with roster room.</div>'}</div><div class="panel"><h2>Visit history</h2>${state.visits.length?state.visits.map(v=>`<div class="schedule-card"><div class="datebox"><small>DAY</small><b>${v.day}</b></div><div><b>${esc(v.school)}</b><div class="muted" style="font-size:11px">${esc(v.note)}</div></div><span class="badge">${esc(v.status)}</span></div>`).join(''):'<div class="empty"><strong>No visits yet.</strong>Use the prospect-day option in Rankings & Film or contact a college.</div>'}<div class="divider"></div><button class="btn ghost" onclick="showView('rankings')">Find prospect days</button></div></div><div class="panel" style="margin-top:14px"><h2>Commitment rule</h2><p class="muted">Once you commit, the career ends. You can wait for more offers or reopen your recruitment before committing; in this build, decommitment is not available after the final commitment screen.</p></div>`}
function commitTo(name){let o=state.offers.find(x=>x.school===name);if(!o){toast('You need an offer before committing.');return}openModal(`<button class="close" onclick="closeModal()">Cancel</button><div class="eyebrow">THE BIG DECISION</div><h2>Commit to ${esc(name)}?</h2><p class="muted">This ends your recruiting career. Your final player profile and recruiting results will remain saved.</p><div class="row"><button class="btn lime" onclick="finishCommit('${esc(name)}')">Make it official</button><button class="btn ghost" onclick="closeModal()">Not yet</button></div>`)}function finishCommit(name){state.committed=true;state.commitment={school:name,day:state.calendarDay};act('Committed to '+name+'. Recruiting career complete.');save();closeModal();renderAll();showView('dashboard');openModal(`<div class="eyebrow">COMMITMENT CONFIRMED</div><h2>${esc(state.player.name)} → ${esc(name)}</h2><p>You built your film, competed through the season, climbed the rankings, and made your college choice.</p><div class="grid g3"><div class="panel"><div class="tiny">Final rating</div><div class="metric">${avg()}</div></div><div class="panel"><div class="tiny">Final rank</div><div class="metric">#${natRank()}</div></div><div class="panel"><div class="tiny">Offers</div><div class="metric">${state.offers.length}</div></div></div><button class="btn lime" onclick="closeModal();showView('dashboard')">View career summary</button>`)}
function renderSettings(){let p=state.player;$('settings').innerHTML=pagehead('CAREER FILE','Settings & saves','Your career saves automatically in this browser. Export a backup before clearing browser data.')+`<div class="grid g2"><div class="panel"><h2>Career status</h2><div class="statline"><span>Player</span><b>${esc(p.name)}</b></div><div class="statline"><span>Graduation class</span><b>${p.classYear}</b></div><div class="statline"><span>Games played</span><b>${state.season.game}</b></div><div class="statline"><span>Recruiting status</span><b>${state.committed?'Committed':'Uncommitted'}</b></div><div class="divider"></div><div class="row"><button class="btn" onclick="exportSave()">Export save file</button><label class="btn ghost" for="importFile">Import save file</label><input id="importFile" type="file" accept="application/json" style="display:none" onchange="importSave(event)"></div></div><div class="panel"><h2>Reset career</h2><p class="muted">Resetting permanently clears this browser's current FIELDHOUSE career. Export a backup first if you want to keep it.</p><button class="btn red" onclick="resetCareer()">Start a new career</button><div class="divider"></div><h3>Design notes</h3><p class="muted" style="font-size:11px">This is a self-contained browser game prototype. Ratings, program interest, roster spots, and simulated recruiting events are generated for gameplay and aren't official scouting data.</p></div></div>`}
function editProfile(){openModal(`<button class="close" onclick="closeModal()">Close</button><h2>Edit player details</h2><form id="editForm" class="formgrid"><div class="field"><label>Name</label><input name="name" value="${esc(state.player.name)}" required></div><div class="field"><label>Hometown</label><input name="hometown" value="${esc(state.player.hometown)}" required></div><div class="field"><label>Club team</label><select name="club">${CLUBS.map(c=>`<option ${c===state.player.club?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Handedness</label><select name="hand"><option ${state.player.hand==='Right'?'selected':''}>Right</option><option ${state.player.hand==='Left'?'selected':''}>Left</option></select></div><div class="full"><button class="btn lime">Save profile</button></div></form>`);$('editForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);for(let k of ['name','hometown','club','hand'])state.player[k]=f.get(k);save();closeModal();renderAll();showView('player');toast('Player profile updated.')}}
function resetCareer(){if(!confirm('Delete this career and start over? Export your save first if needed.'))return;localStorage.removeItem('fieldhouse_save');state=fresh();renderCreate();toast('Career reset.')}
function exportSave(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fieldhouse-career-save.json';a.click();URL.revokeObjectURL(a.href)}function importSave(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.player||!x.season)throw new Error('Invalid save');state=x;save();renderAll();toast('Career imported.')}catch(err){alert('That file is not a valid FIELDHOUSE save.')}};r.readAsText(file)}
function openModal(html){$('modalBox').innerHTML=html;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}function showView(v){if(state.committed&&v!=='dashboard'&&v!=='player'&&v!=='settings'){v='dashboard';toast('Your recruiting career ended when you committed.')}document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('.nav[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===v));if(v==='messages')renderMessages();if(v==='schools')renderSchools();window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('.nav[data-view]').forEach(n=>n.addEventListener('click',()=>showView(n.dataset.view)));$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
function startPostseason(){if(state.season.game<state.season.schedule.length){toast('Finish the regular season first.');return}openModal(`<button class="close" onclick="closeModal()">Close</button><h2>Postseason</h2><p>Your regular season is complete. Choose the next phase.</p><div class="moment"><b>League playoffs</b><p>Win your league bracket to raise exposure.</p><button class="btn lime" onclick="resolvePostseason('league')">Play league playoffs</button></div><div class="moment"><b>State playoffs</b><p>A deeper run can become a signature recruiting moment.</p><button class="btn" onclick="resolvePostseason('state')">Play state playoffs</button></div>`)}function resolvePostseason(kind){closeModal();let win=Math.random()<(avg()+state.player.exposure*.15)/130;state.player.exposure=Math.min(100,state.player.exposure+(win?10:4));state.player.film=Math.min(100,state.player.film+(win?7:3));state.calendarDay+=7;act((win?'Won ':'Exited ')+kind+' playoffs. Recruiting exposure updated.');if(win){PROGRAMS.forEach((s,i)=>{let pr=ensureProgram(i);pr.interest=Math.min(99,pr.interest+3);if(pr.interest>82&&!pr.offer&&pr.committedRecruits<pr.need&&Math.random()<.2){offerSchool(i)}})}save();renderAll();toast(win?'Postseason win! Coaches noticed.':'Postseason finished. Film still adds exposure.');showView('season')}
function offerSchool(i){let s=PROGRAMS[i],pr=ensureProgram(i);if(pr.offer||state.offers.some(o=>o.school===s[0])||pr.committedRecruits>=pr.need)return;pr.offer=true;state.offers.push({school:s[0],division:s[1],day:state.calendarDay});newThread(s[0]+' · Recruiting','coach',i,`We've reviewed your film and discussed your profile as a staff. We'd like to extend an offer and talk through how you could fit into our program. Can we schedule a call?`);act('Received a recruiting offer from '+s[0]+'.')}

const originalRecruitingTick=recruitingTick;recruitingTick=function(g,perf){originalRecruitingTick(g,perf);PROGRAMS.forEach((s,i)=>{let pr=ensureProgram(i);let fit=s[6].toLowerCase().includes(state.player.position.toLowerCase())?1.25:0.7;let threshold=s[1]==='D-I'?82:s[1]==='D-II'?72:67;if(pr.interest>=threshold&&avg()>= (s[1]==='D-I'?73:s[1]==='D-II'?65:60)&&pr.committedRecruits<pr.need&&!pr.offer&&!state.offers.some(o=>o.school===s[0])&&Math.random()<.08*fit)offerSchool(i)})};

function makeShortPlayoffs(year){return [{week:1,opponent:'District semifinal',type:'Playoff',played:false,result:null},{week:2,opponent:'District final',type:'Playoff',played:false,result:null}];}
function makeSchedule(){let opp=['County Prep','North Academy','Westfield','Valley Catholic','Eastside','Central High','Summit School','Lakeside','Regional Prep','Bishop Academy','State-ranked opponent','League rival','Conference contender','Rival High'];return opp.map((opponent,i)=>({week:i+1,opponent,type:[5,13].includes(i)?'Rivalry':i===9?'Ranked matchup':i%4===0?'League':'Regular season',played:false,result:null}));}
function geoRegion(){let h=(state.player.hometown||'').toLowerCase();if(/utah|colorado|arizona|nevada|california|oregon|washington|idaho|montana|wyoming/.test(h))return 'West';if(/florida|georgia|carolina|virginia|maryland|dc|tennessee|alabama|kentucky/.test(h))return 'South';if(/new jersey|new york|pennsylvania|connecticut|massachusetts|rhode island|vermont|new hampshire|maine|delaware/.test(h))return 'Northeast';if(/ohio|michigan|indiana|illinois|wisconsin|minnesota|iowa|missouri/.test(h))return 'Midwest';return 'National';}
function clubTier(){let c=(state.player.club||'').toLowerCase();if(/team 91|madlax|sweetlax|west coast starz|mad dog|red hots|leading edge|sourlax|team 92/.test(c))return 1.22;if(/local|other/.test(c))return .82;return 1.04;}
function geoFit(program){let r=geoRegion(),txt=((program[2]||'')+' '+(program[3]||'')).toLowerCase();if(r==='Northeast'&&/new york|new jersey|pennsylvania|massachusetts|connecticut|maryland|delaware|new england|patriot|ivy|america east/.test(txt))return 1.16;if(r==='West'&&/california|oregon|utah|denver|air force|pacific|west/.test(txt))return 1.16;if(r==='South'&&/carolina|virginia|florida|georgia|southern|atlantic sun|south/.test(txt))return 1.12;return r==='National'?1:.88;}
function renderSeason(){let s=state.season;let phase=s.phase||'junior_regular';let label=({sophomore_playoffs:'Sophomore playoffs',summer_before_junior:'Summer club circuit',junior_regular:'Junior season',junior_playoffs:'Junior playoffs',summer_before_senior:'Senior summer club circuit',senior_regular:'Senior season',senior_playoffs:'Senior playoffs',complete:'Career complete'})[phase]||'High school season';let seasonTitle=phase.startsWith('sophomore')?'Sophomore':phase.includes('senior')?'Senior':'Junior';let old=pagehead; // use original renderer then update its generated labels
let oldPhase=s.phase;s.phase=phase;const originalRenderSeasonRef=window.__unused;
$('season').innerHTML=pagehead('CAREER CALENDAR',label,'Every phase carries your player, film, stats, coach relationships, and recruiting progress forward.')+`<div class="panel" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><div><div class="tiny">CURRENT PHASE</div><h2 style="margin:4px 0">${label}</h2><div class="muted">${esc(state.player.highSchool)} · ${esc(state.player.club)} · ${esc(state.player.position)}</div></div><span class="badge lime">${s.game} CAREER GAMES</span></div><div class="divider"></div><p class="muted" style="margin:0">${phase==='sophomore_playoffs'?'Finish sophomore playoffs to build early film before summer club recruiting.':phase==='summer_before_junior'?'Club events, tournament exposure, and the September recruiting milestone come before junior season.':phase==='junior_regular'?'Every game can change your film, reputation, and recruiting attention. Rivalry and ranked games carry extra weight.':phase==='junior_playoffs'?'Finish the junior postseason, then move into the senior summer circuit.':phase==='summer_before_senior'?'Use summer tournaments and coach conversations to build momentum before senior year.':phase==='senior_regular'?'Your final school season: build your film, chase a title, and manage your offers.':'Finish the high school career with your senior playoff run.'}</p></div><div class="grid g3" style="margin-bottom:14px"><div class="panel"><div class="tiny">Current record</div><div class="metric">${s.wins}-${s.losses}</div></div><div class="panel"><div class="tiny">Games this phase</div><div class="metric">${s.schedule.filter(g=>g.played).length}/${s.schedule.length}</div></div><div class="panel"><div class="tiny">Recruiting offers</div><div class="metric">${state.offers.length}</div></div></div><div class="panel"><div class="row" style="justify-content:space-between"><h2>${seasonTitle} schedule</h2><span class="badge">${s.schedule.length} EVENTS</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Week</th><th>Opponent / event</th><th>Type</th><th>Result</th><th>Your line</th><th></th></tr></thead><tbody>${s.schedule.map((g,i)=>`<tr><td>${g.week}</td><td class="school-name">${esc(g.opponent)}</td><td>${esc(g.type)}</td><td>${g.played?`<b>${esc(g.result||'Complete')}</b>`:'<span class="muted">Upcoming</span>'}</td><td>${g.line?esc(g.line):'—'}</td><td>${g.played?'<span class="badge">FINAL</span>':i===s.schedule.findIndex(x=>!x.played)?`<button class="btn lime" onclick="playNextGame()">Play</button>`:'<span class="muted">Scheduled</span>'}</td></tr>`).join('')}</tbody></table></div><div class="divider"></div><div class="row">${s.schedule.some(g=>!g.played)?'<button class="btn lime" onclick="playNextGame()">Play next game →</button>':''}${['summer_before_junior','summer_before_senior'].includes(phase)?'<button class="btn" onclick="summerEvent()">Play club tournament</button><button class="btn ghost" onclick="prospectDay()">Prospect day</button>':''}</div></div>${s.schedule.every(g=>g.played)?`<div class="panel" style="margin-top:14px"><h2>Phase complete</h2><p class="muted">Your results are saved. Advance to the next part of your career.</p><button class="btn lime" onclick="advanceCareerPhase()">${phase==='sophomore_playoffs'?'Start summer club circuit':phase==='junior_playoffs'?'Start senior summer circuit':phase==='senior_playoffs'?'Finish high school career':'Continue career'} →</button></div>`:''}`;}
function advanceCareerPhase(){let s=state.season,p=state.player;switch(s.phase){case 'sophomore_playoffs':s.phase='summer_before_junior';s.year='Summer';s.schedule=[{week:1,opponent:clubEventName(),type:'Club tournament',played:false},{week:2,opponent:'Summer showcase',type:'Showcase',played:false},{week:3,opponent:'Regional club event',type:'Club tournament',played:false}];act('Sophomore playoffs ended. Summer club circuit begins.');break;case 'summer_before_junior':s.phase='junior_regular';s.year='Junior';s.schedule=makeSchedule();s.game=0;s.week=1;s.wins=0;s.losses=0;state.calendarDay+=21;act('September recruiting window: coaches begin reaching out based on film, club exposure, geography, and roster needs.');automaticRecruitingSweep(true);break;case 'junior_regular':s.phase='junior_playoffs';s.schedule=makeShortPlayoffs('Junior');s.game=0;s.week=1;act('Junior regular season complete. Playoffs begin.');break;case 'junior_playoffs':s.phase='summer_before_senior';s.year='Summer';s.schedule=[{week:1,opponent:clubEventName(),type:'Club tournament',played:false},{week:2,opponent:'National summer showcase',type:'Showcase',played:false},{week:3,opponent:'Final club event',type:'Club tournament',played:false}];act('Junior playoffs complete. Senior summer recruiting begins.');break;case 'summer_before_senior':s.phase='senior_regular';s.year='Senior';s.schedule=makeSchedule();s.game=0;s.week=1;s.wins=0;s.losses=0;state.calendarDay+=21;automaticRecruitingSweep(true);act('Senior season begins. Your previous film, offers, and relationships carry forward.');break;case 'senior_regular':s.phase='senior_playoffs';s.schedule=makeShortPlayoffs('Senior');s.game=0;s.week=1;act('Senior regular season complete. Final playoff run begins.');break;case 'senior_playoffs':s.phase='complete';s.schedule=[];act('High school career complete. Review offers and commit when ready.');break;default:toast('This career phase is already complete.');return;}save();renderAll();showView('season');}
function clubEventName(){let c=state.player.club;let m={'Team 92':'Team 92 Invitational','Sourlax':'Sourlax Summer Shootout','Baltimore Lobsters':'Chesapeake Lobster Classic','Mad Cat':'Mad Cat Summer Jam','Red Knots':'Red Knots Invitational','Long Island Excess':'Long Island Excess Showcase','Bleeding Edge':'Leading Edge Summer Circuit','Crime Time':'Prime Time Crime Classic','Brotherly Shove':'Brotherly Shove Invitational'};return m[c]||c+' Summer Tournament';}
function playNextGame(){let g=state.season.schedule.find(x=>!x.played);if(!g){toast('This phase is complete. Advance to the next phase.');return}let p=state.player;let choices=p.position==='Close Defense'?[['lockdown','Take away topside','Use footwork and positioning to force a bad angle.'],['check','Time a stick check','Go for a disruption without losing your feet.'],['slide','Recognize and call the slide','Read the dodge and help protect the middle.'],['clear','Win the ground ball and start the clear','Secure possession and make the outlet pass.']]:p.position==='LSM'?[['gb','Attack the ground ball','Create a transition opportunity.'],['check','Disrupt the carrier','Use reach and timing to cause a turnover.'],['clear','Start transition','Win the ball and push offense.']]:p.position==='Goalie'?[['position','Set position early','Read the shooter and take away the best angle.'],['communicate','Direct the defense','Organize slides and protect the middle.'],['clear','Make the outlet','Save possession and start transition.']]:p.position==='FOGO'?[['clamp','Win the clamp','Use technique and timing to gain possession.'],['wing','Control the wing play','Help your team secure the loose ball.'],['transition','Push transition','Turn possession into a scoring chance.']]:[['dodge','Dodge your matchup','Create an advantage with a decisive move.'],['feed','Feed the cutter','Read the defense and find the open teammate.'],['shoot','Take the shot','Finish the chance if the look is there.'],['ride','Make a defensive play','Pressure the clear and try to regain possession.']];openModal(`<button class="close" onclick="closeModal()">Close</button><div class="eyebrow">${esc(state.season.phase||'SEASON')} · WEEK ${g.week}</div><h2>${esc(g.opponent)}</h2><p class="muted">Choose one defining play. Your position, attributes, lacrosse IQ, fatigue, and opponent level shape the result; the rest of the game simulates around it.</p>${choices.map(c=>`<div class="moment"><b>${c[1]}</b><p>${c[2]}</p><button class="btn ${c[0]===choices[0][0]?'lime':''}" onclick="resolveGame('${c[0]}')">Make the play →</button></div>`).join('')}`)}
function resolveGame(action){closeModal();let s=state.season,g=s.schedule.find(x=>!x.played),p=state.player;if(!g)return;let phase=s.phase||'junior_regular',isClub=phase.startsWith('summer_');let attrs=p.stats||{},iq=Number(attrs['Lacrosse IQ']||p.iq||58),fat=Number(state.training.fatigue||0);let iqFactor=(iq-60)/100;let relevant=action==='lockdown'||action==='position'?Number(attrs['On-ball Defense']||attrs.Positioning||attrs.Footwork||avg()):action==='check'?Number(attrs['Stick Checks']||attrs['On-ball Defense']||avg()):action==='slide'||action==='communicate'?Number(attrs['Slide IQ']||attrs['Lacrosse IQ']||iq):action==='clear'||action==='feed'?Number(attrs.Clearing||attrs.Passing||avg()):action==='dodge'?Number(attrs.Dodging||avg()):action==='shoot'?Number(attrs.Shooting||avg()):action==='clamp'?Number(attrs.Clamps||attrs.Faceoffs||avg()):action==='gb'||action==='wing'?Number(attrs['Ground Balls']||attrs['Wing Play']||avg()):avg();let performance=Math.max(.35,Math.min(1.9,(relevant/75)+iqFactor-(fat/240)+(Math.random()*.5-.22)));let close=['Close Defense','LSM'].includes(p.position),goalie=p.position==='Goalie',fogo=p.position==='FOGO';let goals=0,assists=0,gb=0,caused=0,saves=0,clear=0; if(goalie){saves=Math.max(2,Math.round(4+performance*3+Math.random()*4));}else if(close){gb=Math.max(1,Math.round(2+performance*2+Math.random()*2));caused=Math.max(0,Math.round((action==='check'?1.4:action==='lockdown'||action==='slide'?1:.6)*performance+Math.random()*.8));clear=action==='clear'?1+Math.round(Math.random()):Math.round(Math.random());goals=Math.random()<.055?1:0;assists=(action==='clear'&&Math.random()<.3)?1:0;}else if(fogo){gb=Math.max(2,Math.round(3+performance*2+Math.random()*2));goals=action==='transition'&&Math.random()<.25?1:0;assists=action==='transition'&&Math.random()<.25?1:0;}else{gb=Math.max(0,Math.round(performance+Math.random()*2));goals=Math.max(0,Math.round((action==='shoot'||action==='dodge'?1:.25)*performance+Math.random()*.7-.45));assists=Math.max(0,Math.round((action==='feed'?1.1:.3)*performance+Math.random()*.6-.35));}
let rivalry=g.type==='Rivalry'||/rival/i.test(g.opponent);let teamScore=Math.max(3,Math.round(7+Math.random()*5+(performance-1)*2));let oppScore=Math.max(3,Math.round(7+Math.random()*5+(rivalry?.5:0)));if(teamScore===oppScore)teamScore+=Math.random()<.5?1:0;let win=teamScore>oppScore;let event=isClub; s.game=(s.game||0)+1;s.week=g.week+1;if(!event){if(win)s.wins=(s.wins||0)+1;else s.losses=(s.losses||0)+1;}s.goals=(s.goals||0)+goals;s.assists=(s.assists||0)+assists;s.gb=(s.gb||0)+gb;s.caused=(s.caused||0)+caused;s.saves=(s.saves||0)+saves;g.played=true;g.result=event?'Completed':`${teamScore}-${oppScore}`;g.line=goalie?`${saves} SV`:close?`${goals} G · ${assists} A · ${gb} GB · ${caused} CT${clear?' · '+clear+' clears':''}`:`${goals} G · ${assists} A · ${gb} GB`;g.outcome=win?'win':'loss';s.lastResult={opponent:g.opponent,score:g.result,win,goals,assists,gb,caused,saves,performance,action};state.calendarDay+=7;state.training.fatigue=Math.min(90,fat+12);state.training.actionsThisWeek=0;
// IQ accelerates relevant skill growth rather than awarding unrelated free points.
let target=close?['On-ball Defense','Footwork','Stick Checks','Slide IQ','Ground Balls']:goalie?['Reactions','Positioning','Communication','Angle Play']:fogo?['Faceoffs','Clamps','Wing Play','Ground Balls']:['Shooting','Dodging','Passing','Stick Skills'];target=target.filter(a=>attrs[a]!==undefined);let gain=(.12+Math.random()*.24)*(1+Math.max(0,iq-55)/130)*(performance>1.35?1.2:1);target.forEach(a=>attrs[a]=Math.min(99,Math.round(((attrs[a]||60)+gain)*10)/10));if(attrs['Lacrosse IQ']!==undefined&&action!=='')attrs['Lacrosse IQ']=Math.min(99,Math.round((iq+.1+Math.max(0,performance-1)*.15)*10)/10);p.iq=attrs['Lacrosse IQ']||iq;p.film=Math.min(100,(p.film||0)+(performance>1.35?3:1)+(rivalry?1:0));p.exposure=Math.min(100,(p.exposure||0)+(performance>1.35?3:1)+(rivalry?2:0));if(event){p.exposure=Math.min(100,p.exposure+2*clubTier());}act(`${event?'Played at':'Played'} ${g.opponent}: ${g.result}. Defining play: ${action}. ${close?`Defensive line: ${gb} ground balls, ${caused} caused turnovers.`:`${goals} goals, ${assists} assists.`}`);if(!event)recruitingTick(g,performance);if(phase==='summer_before_junior'||phase==='summer_before_senior')automaticRecruitingSweep(false);save();renderAll();showView('season');openModal(`<div class="eyebrow">${event?'CLUB EVENT':'FINAL'} · WEEK ${g.week}</div><h2>${event?'Tournament day complete':(win?'Win.':'Final score.')+' '+g.result}</h2><p class="muted">${esc(g.opponent)} · ${esc(g.type)}</p><div class="grid g3"><div class="panel"><div class="tiny">${close?'Ground balls':goalie?'Saves':'Goals'}</div><div class="metric">${close?gb:goalie?saves:goals}</div></div><div class="panel"><div class="tiny">${close?'Caused turnovers':'Assists'}</div><div class="metric">${close?caused:assists}</div></div><div class="panel"><div class="tiny">Lacrosse IQ</div><div class="metric">${Math.round(p.iq)}</div></div></div><div class="notice" style="margin:14px 0">Your one interactive play shaped the result. Performance, IQ, film, and recruiting exposure all feed into future development and coach interest.</div><div class="row"><button class="btn lime" onclick="closeModal();showView('season')">Continue →</button><button class="btn ghost" onclick="closeModal();showView('messages')">Check messages</button></div>`)}
function automaticRecruitingSweep(september){let p=state.player;PROGRAMS.forEach((s,i)=>{let pr=ensureProgram(i);let gf=geoFit(s),ct=clubTier();let fit=(s[6]||'').toLowerCase().includes(p.position.toLowerCase())?1.15:.8;let exposureScore=(p.exposure||0)*.24+(p.film||0)*.23+(avg()-60)*.55;let bump=Math.max(0,Math.round((exposureScore/10)*gf*ct*fit));pr.interest=Math.min(99,pr.interest+(september?bump+3:Math.max(0,bump-1)));let open=pr.committedRecruits<pr.need&&!pr.offer&&!state.offers.some(o=>o.school===s[0]);let threshold=s[1]==='D-I'?69:s[1]==='D-II'?61:56;let existing=state.threads.some(t=>t.kind==='coach'&&t.schoolId===i);if(open&&pr.interest>=threshold-9&&!existing&&Math.random()<Math.min(.9,(pr.interest-threshold+18)/35)*gf*ct){newThread(s[0]+' · Recruiting','coach',i,`${september?'We are beginning our fall recruiting evaluations and your club/high-school film is on our board.':'We have been tracking your recent film and wanted to check on your upcoming schedule.'} We are especially evaluating ${p.position.toLowerCase()} prospects and would like to keep following your season.`);act(s[0]+' reached out after reviewing your film.');pr.lastContact=state.calendarDay;}if(open&&pr.interest>=threshold+4&&avg()>=(s[1]==='D-I'?72:s[1]==='D-II'?64:59)&&!existing&&Math.random()<.035*gf*ct)offerSchool(i);});if(september)act('September recruiting window: coaches independently reviewed film, geography, club circuit, and roster needs.');save();}
// Coaches initiate contact at milestone moments; geography changes probability, not eligibility.
const _oldRecruitingTick = recruitingTick;
recruitingTick=function(g,perf){_oldRecruitingTick(g,perf);automaticRecruitingSweep(false)};
// Training is limited, and IQ improves the rate of relevant skill development.
const _oldTrain=train;
train=function(type){let t=state.training;t.actionsThisWeek=t.actionsThisWeek||0;if(t.actionsThisWeek>=3){toast('Three development sessions used. Your limit resets after the next game.');return;}let before=state.player.stats['Lacrosse IQ']||state.player.iq||58;_oldTrain(type);let p=state.player,iq=p.stats['Lacrosse IQ']||p.iq||before;let attrs=ATTRS[p.position]||[];if(iq>before){let relevant=p.position==='Close Defense'?['On-ball Defense','Footwork','Stick Checks','Slide IQ']:p.position==='Goalie'?['Reactions','Positioning','Communication']:['Passing','Stick Skills','Dodging'];relevant.forEach(a=>{if(p.stats[a]!==undefined)p.stats[a]=Math.min(99,Math.round((p.stats[a]+(iq-before)*.22)*10)/10)});p.iq=iq;save();renderAll();showView('development')}};
// Keep a conversation readable and the compose bar available from the first message onward.
const _oldRenderMessages=renderMessages;
renderMessages=function(){_oldRenderMessages();let cm=$('chatMessages');if(cm){cm.style.overflowY='auto';cm.style.minHeight='240px';cm.style.maxHeight='calc(72vh - 130px)';cm.scrollTop=cm.scrollHeight;}let form=$('chatForm');if(form){let inp=form.querySelector('input[name="message"]');if(inp){inp.disabled=false;inp.focus({preventScroll:true});}}};
function summerEvent(){let phase=state.season.phase||'junior_regular';if(!phase.startsWith('summer_')){toast('Club tournaments are on the calendar during summer phases.');return;}let g=state.season.schedule.find(x=>!x.played);if(g){playNextGame();return;}toast('Advance to the next career phase.');}
function startPostseason(){if((state.season.phase||'').includes('regular')){state.season.phase=state.season.phase==='senior_regular'?'senior_playoffs':'junior_playoffs';state.season.schedule=makeShortPlayoffs(state.season.year);state.season.game=0;state.season.week=1;save();renderAll();showView('season');return;}advanceCareerPhase();}
function resolvePostseason(kind){let s=state.season;let win=Math.random()<Math.min(.85,.35+avg()/180+(state.player.exposure||0)/500);state.player.exposure=Math.min(100,state.player.exposure+(win?9:3));state.player.film=Math.min(100,state.player.film+(win?6:2));state.calendarDay+=7;act((win?'Won ':'Finished ')+kind+' playoff round. Recruiting exposure updated.');if(win)automaticRecruitingSweep(false);save();renderAll();showView('season');}
// Render current stage correctly after save migration.
if(state&&state.created){state.season.phase=state.season.phase||'junior_regular';if(!state.player.iq)state.player.iq=state.player.stats?.['Lacrosse IQ']||58;}

if(!state||!state.created)state=fresh();boot();
</script></body></html>
